<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Перевод .wts – совместный словарь</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .app {
      max-width: 1000px;
      width: 100%;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; color: #1a237e; margin-bottom: 20px; }
    .auth-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      padding: 8px 14px;
      background: #e8eaf6;
      border-radius: 8px;
    }
    .auth-bar button {
      padding: 6px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      background: #1a237e;
      color: white;
    }
    .auth-bar button:hover { background: #0d47a1; }
    .auth-bar .user-info {
      font-weight: 500;
      margin-right: auto;
    }
    .auth-bar .set-name-btn {
      background: #2e7d32;
    }
    .auth-bar .set-name-btn:hover { background: #1b5e20; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      align-items: center;
    }
    .toolbar button {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      background: #0d47a1;
      color: white;
      transition: 0.2s;
      font-weight: 500;
    }
    .toolbar button:hover { background: #1565c0; }
    .toolbar .export-btn { background: #2e7d32; }
    .toolbar .export-btn:hover { background: #388e3c; }
    .toolbar .import-btn { background: #e65100; }
    .toolbar .import-btn:hover { background: #bf360c; }
    #fileInput { display: none; }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #f5f5f5;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 14px;
      flex-wrap: wrap;
    }
    .filter-group label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .filter-group input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .pagination {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-left: auto;
    }
    .pagination select {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    .pagination span {
      font-size: 14px;
      color: #333;
    }
    .pagination button {
      padding: 4px 12px;
      background: #e0e0e0;
      color: #333;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .pagination button:hover:not(:disabled) { background: #bdbdbd; }
    .pagination input[type="number"] {
      width: 60px;
      padding: 4px 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
      text-align: center;
    }
    .pagination .goto-btn {
      background: #0d47a1;
      color: white;
      padding: 4px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .pagination .goto-btn:hover { background: #1565c0; }
    .stats {
      font-size: 14px;
      color: #555;
      font-weight: 500;
      white-space: nowrap;
    }
    .entry {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 8px 12px;
      padding: 12px 14px;
      background: #f8f9fa;
      border-radius: 8px;
      border-left: 4px solid #0d47a1;
      margin-bottom: 8px;
    }
    .entry.group-header {
      border-left-color: #e65100;
      background: #fff8e1;
    }
    .entry .meta {
      font-size: 13px;
      color: #888;
      min-width: 60px;
    }
    .entry .comment {
      font-size: 13px;
      color: #5d4037;
      background: #fff3e0;
      padding: 2px 8px;
      border-radius: 12px;
      display: inline-block;
    }
    .entry .original {
      flex: 1 1 100%;
      font-weight: 500;
      padding: 4px 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .entry .translation-input {
      flex: 2 1 200px;
      padding: 6px 10px;
      border: 1px solid #cfd8dc;
      border-radius: 6px;
      font-size: 15px;
      min-width: 150px;
    }
    .entry .translation-input:focus {
      border-color: #0d47a1;
      outline: none;
    }
    .entry .group-info {
      font-size: 13px;
      color: #e65100;
      background: #fff3e0;
      padding: 2px 10px;
      border-radius: 12px;
      margin-left: auto;
    }
    .entry .author-info {
      font-size: 12px;
      color: #666;
      margin: 2px 0;
    }
    .entry .comment-section {
      flex: 1 1 100%;
      margin-top: 6px;
      padding-top: 8px;
      border-top: 1px dashed #ccc;
    }
    .entry .comment-section .comment-text {
      font-size: 14px;
      background: #fffde7;
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 4px;
      white-space: pre-wrap;
    }
    .entry .comment-section .comment-author {
      font-size: 12px;
      color: #666;
    }
    .entry .comment-section .comment-input {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid #cfd8dc;
      border-radius: 6px;
      font-size: 14px;
      margin-top: 4px;
    }
    .entry .comment-section .comment-save-btn {
      background: #0d47a1;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 13px;
      margin-top: 4px;
    }
    .entry .comment-section .comment-save-btn:hover { background: #1565c0; }
    .dictionary {
      max-height: 600px;
      overflow-y: auto;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 4px 0;
    }
    .loader {
      text-align: center;
      padding: 20px;
      color: #888;
    }
    .status {
      margin-top: 16px;
      font-size: 14px;
      color: #546e7a;
      border-top: 1px solid #ecf0f1;
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
    }
    .status .online { color: #2e7d32; font-weight: 600; }
  </style>
</head>
<body>
<div class="app">
  <h1>📚 Перевод .wts – совместная работа</h1>

  <!-- Панель авторизации -->
  <div class="auth-bar" id="authBar">
    <span class="user-info" id="userInfo">Не авторизован</span>
    <button id="loginGoogleBtn">Войти через Google</button>
    <button id="loginAnonymousBtn">Войти анонимно</button>
    <button id="setNameBtn" class="set-name-btn" style="display:none;">Задать имя</button>
    <button id="logoutBtn">Выйти</button>
  </div>

  <div class="toolbar">
    <button id="refreshBtn">🔄 Обновить</button>
    <button class="import-btn" id="importBtn">📂 Загрузить .wts</button>
    <input type="file" id="fileInput" accept=".wts">
    <button class="export-btn" id="exportBtn">⬇ Скачать .wts</button>

    <div class="filter-group">
      <label><input type="checkbox" id="filterOnlyRussian"> Только с русскими буквами</label>
      <label><input type="checkbox" id="filterNoTranslation"> Без перевода</label>
      <label><input type="checkbox" id="filterHideEditorSuffix"> Скрыть с EditorSuffix</label>
      <label><input type="checkbox" id="groupMode"> Группировать по шаблону</label>
    </div>

    <div class="pagination">
      <button id="prevPage" disabled>◀</button>
      <span id="pageInfo">1 / 1</span>
      <button id="nextPage" disabled>▶</button>
      <input type="number" id="pageInput" min="1" value="1">
      <button class="goto-btn" id="gotoPage">Перейти</button>
      <select id="perPage">
        <option value="10">10</option>
        <option value="25" selected>25</option>
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="0">Все</option>
      </select>
    </div>
    <span class="stats" id="stats">Записей: 0</span>
  </div>

  <div id="dictionaryContainer" class="dictionary">
    <div class="loader">Загрузка словаря...</div>
  </div>

  <div class="status">
    <span id="connectionStatus">⏳ Подключение...</span>
    <span id="countStatus">0</span>
  </div>
</div>

<script>
  // ============ КОНФИГУРАЦИЯ FIREBASE ============
  const firebaseConfig = {
    apiKey: "AIzaSyATbe93bnOiAQmdTUX1dh22UXwtA_dbMWI",
    authDomain: "translatorapp-6fd48.firebaseapp.com",
    databaseURL: "https://translatorapp-6fd48-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "translatorapp-6fd48",
    storageBucket: "translatorapp-6fd48.firebasestorage.app",
    messagingSenderId: "428558181807",
    appId: "1:428558181807:web:b891cd4d29c8b985eebb5a"
  };
  // =================================================

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const auth = firebase.auth();
  const stringsRef = db.ref('strings');
  const usersRef = db.ref('users');

  // DOM элементы
  const container = document.getElementById('dictionaryContainer');
  const statsSpan = document.getElementById('stats');
  const countStatus = document.getElementById('countStatus');
  const connectionStatus = document.getElementById('connectionStatus');
  const fileInput = document.getElementById('fileInput');
  const importBtn = document.getElementById('importBtn');
  const exportBtn = document.getElementById('exportBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const filterOnlyRussian = document.getElementById('filterOnlyRussian');
  const filterNoTranslation = document.getElementById('filterNoTranslation');
  const filterHideEditorSuffix = document.getElementById('filterHideEditorSuffix');
  const groupMode = document.getElementById('groupMode');
  const perPageSelect = document.getElementById('perPage');
  const prevPageBtn = document.getElementById('prevPage');
  const nextPageBtn = document.getElementById('nextPage');
  const pageInfo = document.getElementById('pageInfo');
  const pageInput = document.getElementById('pageInput');
  const gotoPageBtn = document.getElementById('gotoPage');

  // Авторизация элементы
  const userInfo = document.getElementById('userInfo');
  const loginGoogleBtn = document.getElementById('loginGoogleBtn');
  const loginAnonymousBtn = document.getElementById('loginAnonymousBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const setNameBtn = document.getElementById('setNameBtn');

  // Состояние
  let allData = [];
  let currentPage = 0;
  let itemsPerPage = 25;
  let currentUser = null;
  let currentDisplayName = '';

  // ========== АВТОРИЗАЦИЯ ==========

  // Обновление интерфейса пользователя
  function updateAuthUI(user) {
    if (user) {
      currentUser = user;
      // Получаем отображаемое имя из базы или из профиля
      const uid = user.uid;
      usersRef.child(uid).child('displayName').once('value', (snap) => {
        let name = snap.val();
        if (!name) {
          // Если нет в базе, используем displayName из профиля или генерируем
          name = user.displayName || 'Аноним';
          // Сохраняем в базу
          usersRef.child(uid).update({ displayName: name });
        }
        currentDisplayName = name;
        userInfo.textContent = `👤 ${name} (${user.email || 'аноним'})`;
        setNameBtn.style.display = 'inline-block';
        loginGoogleBtn.style.display = 'none';
        loginAnonymousBtn.style.display = 'none';
        logoutBtn.style.display = 'inline-block';
      });
    } else {
      currentUser = null;
      currentDisplayName = '';
      userInfo.textContent = 'Не авторизован';
      setNameBtn.style.display = 'none';
      loginGoogleBtn.style.display = 'inline-block';
      loginAnonymousBtn.style.display = 'inline-block';
      logoutBtn.style.display = 'none';
    }
  }

  // Вход через Google
  loginGoogleBtn.addEventListener('click', () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(err => alert('Ошибка входа: ' + err.message));
  });

  // Анонимный вход
  loginAnonymousBtn.addEventListener('click', () => {
    auth.signInAnonymously().catch(err => alert('Ошибка входа: ' + err.message));
  });

  // Выход
  logoutBtn.addEventListener('click', () => {
    auth.signOut();
  });

  // Установка имени (для анонимных пользователей)
  setNameBtn.addEventListener('click', () => {
    if (!currentUser) return;
    const newName = prompt('Введите ваше отображаемое имя:', currentDisplayName);
    if (newName && newName.trim() !== '') {
      const name = newName.trim();
      usersRef.child(currentUser.uid).update({ displayName: name })
        .then(() => {
          currentDisplayName = name;
          userInfo.textContent = `👤 ${name} (${currentUser.email || 'аноним'})`;
        })
        .catch(err => alert('Ошибка сохранения имени: ' + err.message));
    }
  });

  // Отслеживание состояния авторизации
  auth.onAuthStateChanged(user => {
    updateAuthUI(user);
    // Перерисовываем, чтобы обновить авторов
    render();
  });

  // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========

  function getCurrentUserInfo() {
    if (currentUser) {
      return { uid: currentUser.uid, displayName: currentDisplayName };
    }
    return { uid: null, displayName: 'Аноним' };
  }

  function hasRussian(text) {
    return /[а-яё]/i.test(text);
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function extractNumbers(str) {
    const matches = str.match(/\d+/g);
    return matches ? matches.map(Number) : [];
  }

  function normalizeText(str) {
    return str.replace(/\s+/g, ' ').trim();
  }

  function makePattern(str) {
    return normalizeText(str).replace(/\d+/g, '#');
  }

  function applyTranslationToMember(templateTranslation, original) {
    const numbers = extractNumbers(original);
    let index = 0;
    return templateTranslation.replace(/\d+/g, function(match) {
      if (index < numbers.length) {
        return numbers[index++];
      }
      return match;
    });
  }

  // ========== ПОСТРОЕНИЕ ГРУПП ==========
  function buildGroups(dataArray) {
    const map = new Map();
    for (const item of dataArray) {
      const pattern = makePattern(item.original);
      if (!map.has(pattern)) map.set(pattern, []);
      map.get(pattern).push(item);
    }
    const groups = [];
    for (const [pattern, members] of map) {
      members.sort((a, b) => parseInt(a.key) - parseInt(b.key));
      groups.push({ pattern, members });
    }
    groups.sort((a, b) => parseInt(a.members[0].key) - parseInt(b.members[0].key));
    return groups;
  }

  // ========== ЛОГИКА ФИЛЬТРАЦИИ ==========
  function getFilteredData() {
    let filtered = allData;
    if (filterOnlyRussian.checked) {
      filtered = filtered.filter(item => hasRussian(item.original));
    }
    if (filterNoTranslation.checked) {
      filtered = filtered.filter(item => item.translation.trim() === '');
    }
    if (filterHideEditorSuffix.checked) {
      filtered = filtered.filter(item => {
        const comment = item.comment || '';
        return !comment.toLowerCase().includes('editorsuffix');
      });
    }
    return filtered;
  }

  // ========== ПОЛУЧЕНИЕ ЭЛЕМЕНТОВ ДЛЯ ОТОБРАЖЕНИЯ ==========
  function getDisplayItems() {
    const filtered = getFilteredData();
    if (!groupMode.checked) {
      return filtered;
    } else {
      const groups = buildGroups(filtered);
      return groups.map(group => {
        const rep = { ...group.members[0] };
        rep._groupMembers = group.members;
        return rep;
      });
    }
  }

  function getPaginatedData(items) {
    if (itemsPerPage === 0) return items;
    const start = currentPage * itemsPerPage;
    return items.slice(start, start + itemsPerPage);
  }

  // ========== ОСНОВНАЯ ФУНКЦИЯ ОТРИСОВКИ ==========
  function render() {
    try {
      const displayItems = getDisplayItems();
      const totalDisplay = displayItems.length;
      const totalPages = itemsPerPage === 0 ? 1 : Math.ceil(totalDisplay / itemsPerPage);
      if (totalDisplay === 0) {
        currentPage = 0;
      } else if (currentPage >= totalPages) {
        currentPage = totalPages - 1;
      }
      const pageItems = getPaginatedData(displayItems);

      // Пагинация
      const curPageDisplay = totalDisplay === 0 ? 0 : currentPage + 1;
      pageInfo.textContent = totalDisplay === 0 ? '0 / 0' : `${curPageDisplay} / ${totalPages}`;
      pageInput.value = curPageDisplay;
      pageInput.max = totalPages;
      prevPageBtn.disabled = currentPage === 0 || totalDisplay === 0;
      nextPageBtn.disabled = currentPage >= totalPages - 1 || totalDisplay === 0;

      // Статистика
      const totalAll = allData.length;
      const filteredCount = getFilteredData().length;
      statsSpan.textContent = `Всего: ${totalAll} | Отфильтровано: ${filteredCount} | Показано: ${totalDisplay}`;

      if (totalDisplay === 0) {
        container.innerHTML = '<div class="loader">Нет записей, соответствующих фильтрам.</div>';
        countStatus.textContent = '0';
        return;
      }

      let html = '';
      for (const item of pageItems) {
        const key = item.key;
        const original = item.original || '';
        const translation = item.translation || '';
        const comment = item.comment || '';
        const commentAuthor = item.commentAuthor || '';
        const commentAuthorName = item.commentAuthorName || '';
        const translationAuthor = item.translationAuthor || '';
        const translationAuthorName = item.translationAuthorName || '';
        const safeKey = key.replace(/"/g, '&quot;');
        let groupInfo = '';
        let groupClass = '';
        if (groupMode.checked && item._groupMembers && item._groupMembers.length > 1) {
          const members = item._groupMembers;
          const keys = members.map(m => m.key).join(', ');
          groupInfo = `Группа (${members.length} шт: #${keys})`;
          groupClass = 'group-header';
        }

        // Автор перевода
        let translationAuthorDisplay = translationAuthorName ? `✍️ ${escapeHtml(translationAuthorName)}` : '';
        // Автор комментария
        let commentAuthorDisplay = commentAuthorName ? `💬 ${escapeHtml(commentAuthorName)}` : '';

        html += `
          <div class="entry ${groupClass}" data-key="${safeKey}" data-group='${JSON.stringify(item._groupMembers || [])}'>
            <span class="meta">#${key}</span>
            ${comment ? `<span class="comment">${escapeHtml(comment)}</span>` : ''}
            <div class="original">${escapeHtml(original)}</div>
            <input class="translation-input" type="text" value="${escapeHtml(translation)}" data-key="${safeKey}" placeholder="Введите перевод...">
            ${groupInfo ? `<span class="group-info">${groupInfo}</span>` : ''}
            <div class="author-info" style="flex:1 1 100%;">
              ${translationAuthorDisplay ? `<span>${translationAuthorDisplay}</span>` : ''}
            </div>
            <div class="comment-section">
              ${comment ? `<div class="comment-text">${escapeHtml(comment)}</div>` : ''}
              ${commentAuthorDisplay ? `<div class="comment-author">${commentAuthorDisplay}</div>` : ''}
              <input class="comment-input" type="text" placeholder="Оставить комментарий..." data-key="${safeKey}">
              <button class="comment-save-btn" data-key="${safeKey}">Сохранить комментарий</button>
            </div>
          </div>
        `;
      }
      container.innerHTML = html;
      countStatus.textContent = totalDisplay;

      // Назначаем обработчики
      container.querySelectorAll('.translation-input').forEach(input => {
        input.removeEventListener('change', handleTranslationChange);
        input.addEventListener('change', handleTranslationChange);
      });

      container.querySelectorAll('.comment-save-btn').forEach(btn => {
        btn.removeEventListener('click', handleCommentSave);
        btn.addEventListener('click', handleCommentSave);
      });
    } catch (err) {
      console.error('Ошибка при рендеринге:', err);
      container.innerHTML = `<div class="loader" style="color:#c62828;">Ошибка отображения: ${err.message}</div>`;
    }
  }

  // ========== ОБРАБОТЧИК ИЗМЕНЕНИЯ ПЕРЕВОДА ==========
  function handleTranslationChange(e) {
    const input = e.currentTarget;
    const key = input.dataset.key;
    const newTranslation = input.value.trim();
    if (newTranslation === '') {
      alert('Перевод не может быть пустым.');
      const originalItem = allData.find(d => d.key === key);
      input.value = originalItem?.translation || '';
      return;
    }

    const item = allData.find(d => d.key === key);
    if (!item) return;

    const userInfo = getCurrentUserInfo();

    // Если режим группировки включён, обрабатываем группу
    if (groupMode.checked) {
      const pattern = makePattern(item.original);
      const members = allData.filter(m => makePattern(m.original) === pattern);
      if (members.length > 1) {
        const updates = {};
        for (const member of members) {
          let memberTranslation;
          if (member.key === key) {
            memberTranslation = newTranslation;
          } else {
            memberTranslation = applyTranslationToMember(newTranslation, member.original);
          }
          const localItem = allData.find(d => d.key === member.key);
          if (localItem) {
            localItem.translation = memberTranslation;
            localItem.translationAuthor = userInfo.uid;
            localItem.translationAuthorName = userInfo.displayName;
          }
          updates[member.key] = {
            translation: memberTranslation,
            translationAuthor: userInfo.uid,
            translationAuthorName: userInfo.displayName
          };
        }
        // Отправляем в Firebase
        for (const [k, val] of Object.entries(updates)) {
          stringsRef.child(k).update(val)
            .catch(err => alert('Ошибка сохранения для #' + k + ': ' + err.message));
        }
        render();
        return;
      }
    }

    // Обычное сохранение
    const updateData = {
      translation: newTranslation,
      translationAuthor: userInfo.uid,
      translationAuthorName: userInfo.displayName
    };
    stringsRef.child(key).update(updateData)
      .catch(err => alert('Ошибка сохранения: ' + err.message));
  }

  // ========== ОБРАБОТЧИК СОХРАНЕНИЯ КОММЕНТАРИЯ ==========
  function handleCommentSave(e) {
    const btn = e.currentTarget;
    const key = btn.dataset.key;
    const section = btn.closest('.entry').querySelector('.comment-section');
    const input = section.querySelector('.comment-input');
    const commentText = input.value.trim();
    if (commentText === '') {
      alert('Комментарий не может быть пустым.');
      return;
    }

    const userInfo = getCurrentUserInfo();
    const updateData = {
      comment: commentText,
      commentAuthor: userInfo.uid,
      commentAuthorName: userInfo.displayName
    };

    stringsRef.child(key).update(updateData)
      .then(() => {
        // Обновляем локальные данные
        const item = allData.find(d => d.key === key);
        if (item) {
          item.comment = commentText;
          item.commentAuthor = userInfo.uid;
          item.commentAuthorName = userInfo.displayName;
        }
        render();
      })
      .catch(err => alert('Ошибка сохранения комментария: ' + err.message));
  }

  // ========== СЛУШАЕМ ИЗМЕНЕНИЯ В БАЗЕ ==========
  stringsRef.on('value', (snapshot) => {
    const data = snapshot.val();
    if (!data) {
      allData = [];
      render();
      return;
    }
    const entries = Object.entries(data).sort((a, b) => parseInt(a[0]) - parseInt(b[0]));
    allData = entries.map(([key, entry]) => ({
      key,
      original: entry.original || '',
      translation: entry.translation || '',
      translationAuthor: entry.translationAuthor || '',
      translationAuthorName: entry.translationAuthorName || '',
      comment: entry.comment || '',
      commentAuthor: entry.commentAuthor || '',
      commentAuthorName: entry.commentAuthorName || ''
    }));
    render();
  });

  // ========== ИМПОРТ / ЭКСПОРТ ==========
  function parseWTS(text) {
    const regex = /STRING\s+(\d+)\s*(?:\/\/\s*([^\n]*))?\s*\{([\s\S]*?)\}/g;
    const entries = [];
    let match;
    while ((match = regex.exec(text)) !== null) {
      const number = match[1];
      const comment = (match[2] || '').trim();
      const content = match[3].trim();
      if (content) entries.push({ number, comment, content });
    }
    return entries;
  }

  function importWTS(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const text = e.target.result;
        const parsed = parseWTS(text);
        if (parsed.length === 0) {
          alert('Не удалось найти ни одной строки STRING в файле.');
          return;
        }
        if (!confirm(`Найдено ${parsed.length} строк. Импортировать?`)) return;
        const updates = {};
        for (const item of parsed) {
          updates[item.number] = {
            original: item.content,
            translation: '',
            translationAuthor: '',
            translationAuthorName: '',
            comment: '',
            commentAuthor: '',
            commentAuthorName: ''
          };
        }
        stringsRef.update(updates)
          .then(() => alert(`Импортировано ${parsed.length} строк.`))
          .catch(err => alert('Ошибка импорта: ' + err.message));
      } catch (err) {
        alert('Ошибка при обработке файла: ' + err.message);
      }
    };
    reader.onerror = () => alert('Ошибка чтения файла');
    reader.readAsText(file, 'UTF-8');
  }

  importBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', function(e) {
    if (this.files && this.files[0]) importWTS(this.files[0]);
    this.value = '';
  });

  function generateWTS(data) {
    const keys = Object.keys(data).sort((a, b) => parseInt(a) - parseInt(b));
    let output = '';
    for (const key of keys) {
      const entry = data[key];
      const original = entry.original || '';
      const translation = entry.translation || '';
      const textToWrite = translation.trim() !== '' ? translation : original;
      const comment = entry.comment || '';
      output += `STRING ${key}`;
      if (comment) output += ` // ${comment}`;
      output += `\n{\n${textToWrite}\n}\n\n`;
    }
    return output;
  }

  function exportWTS() {
    stringsRef.once('value', (snapshot) => {
      const data = snapshot.val();
      if (!data || Object.keys(data).length === 0) {
        alert('Нет данных для экспорта.');
        return;
      }
      const wtsText = generateWTS(data);
      const blob = new Blob([wtsText], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'translated_strings.wts';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  }

  exportBtn.addEventListener('click', exportWTS);

  // ========== УПРАВЛЕНИЕ ПАГИНАЦИЕЙ ==========
  function goToPage(page) {
    const displayItems = getDisplayItems();
    const totalPages = itemsPerPage === 0 ? 1 : Math.ceil(displayItems.length / itemsPerPage);
    if (totalPages === 0) {
      currentPage = 0;
    } else {
      if (page < 0) page = 0;
      if (page >= totalPages) page = totalPages - 1;
      currentPage = page;
    }
    render();
  }

  prevPageBtn.addEventListener('click', () => goToPage(currentPage - 1));
  nextPageBtn.addEventListener('click', () => goToPage(currentPage + 1));

  perPageSelect.addEventListener('change', function() {
    itemsPerPage = parseInt(this.value, 10);
    currentPage = 0;
    render();
  });

  function handleGoto() {
    let page = parseInt(pageInput.value, 10);
    if (isNaN(page) || page < 1) page = 1;
    const displayItems = getDisplayItems();
    const totalPages = itemsPerPage === 0 ? 1 : Math.ceil(displayItems.length / itemsPerPage);
    if (totalPages === 0) page = 1;
    if (page > totalPages) page = totalPages;
    goToPage(page - 1);
  }

  gotoPageBtn.addEventListener('click', handleGoto);
  pageInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') handleGoto();
  });

  // Фильтры
  filterOnlyRussian.addEventListener('change', () => { currentPage = 0; render(); });
  filterNoTranslation.addEventListener('change', () => { currentPage = 0; render(); });
  filterHideEditorSuffix.addEventListener('change', () => { currentPage = 0; render(); });
  groupMode.addEventListener('change', () => { currentPage = 0; render(); });

  refreshBtn.addEventListener('click', () => {
    stringsRef.once('value', () => render());
  });

  // ========== ПОДКЛЮЧЕНИЕ ==========
  const connectedRef = firebase.database().ref('.info/connected');
  connectedRef.on('value', (snap) => {
    if (snap.val()) {
      connectionStatus.innerHTML = '✅ Подключено к Firebase';
      connectionStatus.style.color = '#2e7d32';
    } else {
      connectionStatus.innerHTML = '❌ Офлайн (изменения сохранятся позже)';
      connectionStatus.style.color = '#e53935';
    }
  });

  console.log('Приложение готово.');
</script>
</body>
</html>
