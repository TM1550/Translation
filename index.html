<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Перевод карты Котомышь</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 16px;
    }
    .app {
      width: 100%;
      max-width: 1400px;
      background: white;
      padding: 20px 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 32px);
      max-height: calc(100vh - 32px);
      overflow: hidden;
    }
    h1 { text-align: center; color: #1a237e; margin: 0 0 12px 0; font-size: 1.8rem; flex-shrink: 0; }
    .auth-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      padding: 8px 14px;
      background: #e8eaf6;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .auth-bar button {
      padding: 6px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      background: #1a237e;
      color: white;
    }
    .auth-bar button:hover { background: #0d47a1; }
    .auth-bar .user-info { font-weight: 500; margin-right: auto; }
    .auth-bar .role-badge {
      background: #ffca28;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      color: #333;
    }
    .auth-bar .admin-badge {
      background: #d32f2f;
      color: white;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
    }
    .auth-bar .set-name-btn { background: #2e7d32; }
    .auth-bar .set-name-btn:hover { background: #1b5e20; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
      align-items: center;
      flex-shrink: 0;
    }
    .toolbar button {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      background: #0d47a1;
      color: white;
      transition: 0.2s;
      font-weight: 500;
    }
    .toolbar button:hover { background: #1565c0; }
    .toolbar .export-btn { background: #2e7d32; }
    .toolbar .export-btn:hover { background: #388e3c; }
    .toolbar .export-originals-btn { background: #455a64; }
    .toolbar .export-originals-btn:hover { background: #37474f; }
    .toolbar .import-btn { background: #e65100; }
    .toolbar .import-btn:hover { background: #bf360c; }
    .toolbar .import-translations-wts-btn { background: #4a148c; }
    .toolbar .import-translations-wts-btn:hover { background: #6a1b9a; }
    .toolbar .db-download-btn { background: #00695c; }
    .toolbar .db-download-btn:hover { background: #004d40; }
    .toolbar .db-restore-btn { background: #b71c1c; }
    .toolbar .db-restore-btn:hover { background: #7f0000; }
    #fileInput, #translationsWtsInput, #dbRestoreInput { display: none; }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #f5f5f5;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 14px;
      flex-wrap: wrap;
    }
    .filter-group label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .filter-group input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
    .search-group { display: flex; align-items: center; gap: 6px; }
    .search-group input[type="text"] {
      padding: 4px 10px;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 14px;
      width: 200px;
      max-width: 100%;
    }
    .search-group input[type="text"]:focus { border-color: #0d47a1; outline: none; }
    .pagination {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-left: auto;
    }
    .pagination select { padding: 4px 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
    .pagination span { font-size: 14px; color: #333; }
    .pagination button {
      padding: 4px 12px;
      background: #e0e0e0;
      color: #333;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
    .pagination button:hover:not(:disabled) { background: #bdbdbd; }
    .pagination input[type="number"] {
      width: 60px;
      padding: 4px 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
      text-align: center;
    }
    .pagination .goto-btn { background: #0d47a1; color: white; padding: 4px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .pagination .goto-btn:hover { background: #1565c0; }
    .stats { font-size: 14px; color: #555; font-weight: 500; white-space: nowrap; }
    .dictionary {
      flex: 1 1 auto;
      overflow-y: auto;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 4px 0;
      min-height: 200px;
      margin-bottom: 8px;
    }
    .entry {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 12px 14px;
      background: #f8f9fa;
      border-radius: 8px;
      border-left: 4px solid #0d47a1;
      margin: 4px 8px;
      align-items: start;
      transition: background 0.2s;
    }
    .entry.inactive { background: #f0f0f0; opacity: 0.7; }
    .entry.inactive .original { text-decoration: line-through; color: #999; }
    .entry.group-header { border-left-color: #e65100; background: #fff8e1; }
    .entry.group-header.inactive { background: #f0e8d0; }
    .entry .left-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 100%;
      word-break: break-word;
    }
    .entry .right-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-left: 1px solid #ddd;
      padding-left: 16px;
      max-width: 100%;
    }
    .entry .meta { font-size: 13px; color: #888; }
    .entry .original { font-weight: 500; white-space: pre-wrap; word-break: break-word; max-width: 100%; }
    .entry .translation-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 8px;
      width: 100%;
    }
    .entry .translation-input {
      flex: 1 1 200px;
      padding: 6px 10px;
      border: 1px solid #cfd8dc;
      border-radius: 6px;
      font-size: 15px;
      font-family: inherit;
      line-height: 1.4;
      width: 100%;
      resize: none;
      overflow: hidden;
      min-height: 38px;
    }
    .entry .translation-input:focus { border-color: #0d47a1; outline: none; }
    .entry .save-translation-btn {
      background: #0d47a1;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 13px;
      align-self: flex-start;
    }
    .entry .save-translation-btn:hover { background: #1565c0; }
    .entry .group-info {
      font-size: 13px;
      color: #e65100;
      background: #fff3e0;
      padding: 2px 10px;
      border-radius: 12px;
      display: inline-block;
      margin-top: 4px;
    }
    .entry .author-info {
      font-size: 12px;
      color: #666;
      margin: 2px 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .entry .confirmed-badge {
      font-size: 13px;
      color: #2e7d32;
      background: #e8f5e9;
      padding: 2px 10px;
      border-radius: 12px;
      margin-left: 8px;
    }
    .entry .confirm-btn {
      background: #1565c0;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    .entry .confirm-btn:hover:not(:disabled) { background: #0d47a1; }
    .entry .confirm-btn:disabled { background: #b0bec5; cursor: not-allowed; opacity: 0.7; }
    .entry .confirm-btn.confirmed { background: #e53935; }
    .entry .confirm-btn.confirmed:hover:not(:disabled) { background: #c62828; }
    .entry .confirm-btn.confirmed:disabled { background: #b0bec5; cursor: not-allowed; }
    .entry .inactive-btn { background: #795548; color: white; border: none; border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
    .entry .inactive-btn:hover { background: #5d4037; }
    .entry .inactive-btn.active { background: #4caf50; }
    .entry .inactive-btn.active:hover { background: #388e3c; }
    .entry .similar-btn { background: #6a1b9a; color: white; border: none; border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
    .entry .similar-btn:hover { background: #4a148c; }
    .entry .last-confirmed-btn { background: #607d8b; color: white; border: none; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
    .entry .last-confirmed-btn:hover { background: #455a64; }
    .entry .original-edit-btn {
      background: #455a64; color: white; border: none; border-radius: 6px;
      padding: 4px 10px; cursor: pointer; font-size: 12px; margin-top: 4px; align-self: flex-start;
    }
    .entry .original-edit-btn:hover { background: #37474f; }
    .entry .original-edit-input {
      width: 100%; padding: 6px 10px; border: 1px solid #cfd8dc; border-radius: 6px;
      font-size: 14px; font-family: inherit; min-height: 60px; resize: vertical; margin-top: 4px;
      line-height: 1.4;
    }
    .entry .original-edit-input:focus { border-color: #455a64; outline: none; }
    .entry .original-edit-buttons { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
    .entry .original-save-btn {
      background: #2e7d32; color: white; border: none; border-radius: 6px;
      padding: 4px 12px; cursor: pointer; font-size: 13px;
    }
    .entry .original-save-btn:hover { background: #1b5e20; }
    .entry .original-cancel-btn {
      background: #9e9e9e; color: white; border: none; border-radius: 6px;
      padding: 4px 12px; cursor: pointer; font-size: 13px;
    }
    .entry .original-cancel-btn:hover { background: #757575; }
    .entry .duplicate-info {
      font-size: 12px; color: #00695c; background: #e0f2f1;
      padding: 2px 8px; border-radius: 10px; display: inline-block;
      margin-top: 4px; cursor: help;
    }
    .entry .duplicate-info:hover { background: #b2dfdb; }
    .entry .original-author-info {
      font-size: 12px; color: #666; margin-top: 2px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    }
    .entry .comment-section {
      grid-column: 1 / -1;
      margin-top: 6px;
      padding-top: 8px;
      border-top: 1px dashed #ccc;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .entry .comment-section .wts-comment {
      font-size: 13px;
      color: #5d4037;
      background: #fff3e0;
      padding: 2px 8px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 4px;
    }
    .entry .comment-section .user-comment {
      font-size: 14px;
      background: #e3f2fd;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 2px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .entry .comment-section .user-comment .comment-text { flex: 1; white-space: pre-wrap; word-break: break-word; }
    .entry .comment-section .user-comment .comment-author { font-size: 12px; color: #666; margin-left: 8px; white-space: nowrap; }
    .entry .comment-section .comment-input { width: 100%; padding: 6px 10px; border: 1px solid #cfd8dc; border-radius: 6px; font-size: 14px; margin-top: 4px; }
    .entry .comment-section .comment-save-btn { background: #0d47a1; color: white; border: none; border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 13px; margin-top: 4px; align-self: flex-start; }
    .entry .comment-section .comment-save-btn:hover { background: #1565c0; }
    .entry .comment-section .show-all-btn { background: #4a148c; color: white; border: none; border-radius: 6px; padding: 2px 10px; cursor: pointer; font-size: 12px; margin-top: 4px; align-self: flex-start; }
    .entry .comment-section .show-all-btn:hover { background: #6a1b9a; }
    .loader { text-align: center; padding: 20px; color: #888; }
    .status {
      flex-shrink: 0;
      margin-top: 8px;
      font-size: 14px;
      color: #546e7a;
      border-top: 1px solid #ecf0f1;
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
    }
    .status .online { color: #2e7d32; font-weight: 600; }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: white;
      max-width: 700px;
      width: 90%;
      max-height: 80vh;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      overflow-y: auto;
      position: relative;
    }
    .modal-box .close-btn { position: absolute; top: 10px; right: 16px; font-size: 28px; cursor: pointer; color: #888; }
    .modal-box .close-btn:hover { color: #333; }
    .modal-box h3 { margin-bottom: 12px; }
    .modal-box .modal-item { margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #eee; }
    .modal-box .modal-item .modal-original { font-weight: 500; white-space: pre-wrap; word-break: break-word; }
    .modal-box .modal-item .modal-translation { color: #555; font-size: 0.95em; margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
    .modal-box .modal-item .modal-score { font-size: 0.8em; color: #888; margin-top: 2px; }
    .modal-box .modal-item strong { background: #ffeb3b; padding: 0 2px; border-radius: 2px; }
    .modal-box .modal-item .modal-header { display: flex; justify-content: space-between; }
    .modal-box .modal-item .modal-header .modal-key { color: #888; font-size: 0.9em; }
    .modal-box .modal-comment { margin-bottom: 8px; padding: 6px 10px; background: #f5f5f5; border-radius: 6px; }
    .modal-box .modal-comment .modal-text { display: block; white-space: pre-wrap; word-break: break-word; }
    .modal-box .modal-comment .modal-author { display: block; font-size: 12px; color: #888; margin-top: 2px; }
    .restore-last-confirmed-btn {
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    .restore-last-confirmed-btn:hover { background: #1b5e20; }
    .last-confirmed-block { background: #f5f5f5; padding: 8px 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
    .last-confirmed-block.confirmed-now { background: #e8f5e9; border-left: 3px solid #2e7d32; }
    .last-confirmed-meta { font-size: 12px; color: #666; margin-top: 4px; }
    @media (max-width: 768px) {
      .entry { grid-template-columns: 1fr; }
      .entry .right-col { border-left: none; padding-left: 0; border-top: 1px solid #ddd; padding-top: 8px; }
      .app { padding: 12px; height: calc(100vh - 24px); }
      .toolbar { gap: 8px; }
      .filter-group { flex-wrap: wrap; gap: 8px; padding: 4px 8px; }
    }
  </style>
</head>
<body>
<div class="app">
  <h1>Перевод карты Котомышь</h1>

  <div class="auth-bar" id="authBar">
    <span class="user-info" id="userInfo">Не авторизован</span>
    <span class="role-badge" id="roleBadge" style="display:none;"></span>
    <span class="admin-badge" id="adminBadge" style="display:none;">🛡️ Админ БД</span>
    <button id="loginGoogleBtn">Войти через Google</button>
    <button id="setNameBtn" class="set-name-btn" style="display:none;">Задать имя</button>
    <button id="logoutBtn">Выйти</button>
  </div>

  <div class="toolbar">
    <button class="import-btn" id="importBtn" style="display:none;">📂 Загрузить .wts</button>
    <input type="file" id="fileInput" accept=".wts">
    <button class="import-translations-wts-btn" id="importTranslationsWtsBtn" style="display:none;">📥 Загрузить переводы .wts</button>
    <input type="file" id="translationsWtsInput" accept=".wts" style="display:none;">
    <label style="display:inline-flex;align-items:center;gap:4px;font-size:14px;background:#e0f2f1;padding:4px 12px;border-radius:20px;cursor:pointer;" title="Если отмечено — загруженные переводы будут помечены как подтверждённые">
      <input type="checkbox" id="confirmImportedTranslations"> Подтвердить импорт
    </label>
    <button class="export-btn" id="exportBtn" style="display:none;">⬇ Скачать .wts (переводы)</button>
    <button class="export-originals-btn" id="exportOriginalsBtn" style="display:none;">⬇ Скачать .wts (оригиналы)</button>

    <label id="editOriginalModeLabel" style="display:none;align-items:center;gap:4px;font-size:14px;background:#eceff1;padding:4px 12px;border-radius:20px;cursor:pointer;" title="Показывать кнопки редактирования оригинальных фраз">
      <input type="checkbox" id="editOriginalMode"> ✏️ Редактирование оригинала
    </label>

    <button class="db-download-btn" id="dbDownloadBtn" style="display:none;">💾 Скачать БД</button>
    <button class="db-restore-btn" id="dbRestoreBtn" style="display:none;">📤 Восстановить БД</button>
    <input type="file" id="dbRestoreInput" accept=".json" style="display:none;">

    <div class="filter-group">
      <label title="Скрыть фразы без русских букв, с EditorSuffix и не из последнего импорта"><input type="checkbox" id="filterHideUnnecessary"> Скрыть ненужные фразы</label>
      <label><input type="checkbox" id="filterNoTranslation"> Без перевода</label>
      <label><input type="checkbox" id="filterUnconfirmed"> Неподтверждённые переводы</label>
      <label><input type="checkbox" id="filterInactive"> Скрыть неактивные</label>
      <label><input type="checkbox" id="groupMode"> Группировать по шаблону</label>
    </div>

    <div class="search-group">
      <input type="text" id="searchInput" placeholder="🔍 Поиск по фразе, переводу или комментарию">
    </div>

    <div class="pagination">
      <button id="prevPage" disabled>◀</button>
      <span id="pageInfo">1 / 1</span>
      <button id="nextPage" disabled>▶</button>
      <input type="number" id="pageInput" min="1" value="1">
      <button class="goto-btn" id="gotoPage">Перейти</button>
      <select id="perPage">
        <option value="10">10</option>
        <option value="25" selected>25</option>
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="0">Все</option>
      </select>
    </div>
    <span class="stats" id="stats">Записей: 0</span>
  </div>

  <div id="dictionaryContainer" class="dictionary">
    <div class="loader">Загрузка словаря...</div>
  </div>

  <div class="modal-overlay" id="commentsModal">
    <div class="modal-box">
      <span class="close-btn" id="modalCloseBtn">&times;</span>
      <h3 id="modalTitle">Комментарии к фразе #<span id="modalKey"></span></h3>
      <div id="modalCommentsList"></div>
    </div>
  </div>

  <div class="modal-overlay" id="similarModal">
    <div class="modal-box">
      <span class="close-btn" id="similarModalClose">&times;</span>
      <h3 id="similarModalTitle">Похожие подтверждённые переводы</h3>
      <div id="similarModalList"></div>
    </div>
  </div>

  <div class="modal-overlay" id="lastConfirmedModal">
    <div class="modal-box">
      <span class="close-btn" id="lastConfirmedClose">&times;</span>
      <h3 id="lastConfirmedTitle">Последний подтверждённый перевод</h3>
      <div id="lastConfirmedContent"></div>
    </div>
  </div>

  <div class="status">
    <span id="connectionStatus">⏳ Подключение...</span>
    <span id="countStatus">0</span>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyATbe93bnOiAQmdTUX1dh22UXwtA_dbMWI",
    authDomain: "translatorapp-6fd48.firebaseapp.com",
    databaseURL: "https://translatorapp-6fd48-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "translatorapp-6fd48",
    storageBucket: "translatorapp-6fd48.firebasestorage.app",
    messagingSenderId: "428558181807",
    appId: "1:428558181807:web:b891cd4d29c8b985eebb5a"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const auth = firebase.auth();
  const stringsRef = db.ref('strings');
  const metadataRef = db.ref('metadata');
  const usersRef = db.ref('users');

  const container = document.getElementById('dictionaryContainer');
  const statsSpan = document.getElementById('stats');
  const countStatus = document.getElementById('countStatus');
  const connectionStatus = document.getElementById('connectionStatus');
  const fileInput = document.getElementById('fileInput');
  const importBtn = document.getElementById('importBtn');
  const importTranslationsWtsBtn = document.getElementById('importTranslationsWtsBtn');
  const translationsWtsInput = document.getElementById('translationsWtsInput');
  const confirmImportedTranslations = document.getElementById('confirmImportedTranslations');
  const exportBtn = document.getElementById('exportBtn');
  const exportOriginalsBtn = document.getElementById('exportOriginalsBtn');

  // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
  function normalizeLineEndings(str) {
    if (!str) return '';
    return str.replace(/\r\n|\r|\n/g, '\n').replace(/\n/g, '\r\n');
  }

  function stripLineBreaks(str) {
    if (str == null) return '';
    let s = String(str);
    s = s.replace(/^[\r\n]+/, '');
    s = s.replace(/(?:[\r\n]+[ \t]*)+$/, '');
    return s;
  }

  function cleanId(rawId) {
    return String(rawId == null ? '' : rawId).replace(/[\s\u00A0]+/g, '');
  }
  function cleanComment(rawComment) {
    return String(rawComment == null ? '' : rawComment)
      .replace(/[\u00A0]/g, ' ')
      .replace(/[\r\n]+/g, ' ')
      .trim();
  }

  function hasRussian(text) { return /[а-яё]/i.test(text); }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function formatTimestamp(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function makePattern(str) {
    if (!str) return '';
    let cleaned = cleanWtsText(str, true);
    cleaned = cleaned.replace(/\d+(?:\.\d+)?/g, '#');
    cleaned = cleaned.replace(/<[^>]+>/g, '<TAG>');
    return cleaned;
  }

  function extractNumbers(str) {
    const matches = str.match(/\d+(?:\.\d+)?/g);
    return matches ? matches.map(Number) : [];
  }

  function applyTranslationToMember(templateTranslation, original) {
    const numbers = extractNumbers(original);
    let index = 0;
    return templateTranslation.replace(/\d+(?:\.\d+)?/g, function(match) {
      if (index < numbers.length) return numbers[index++];
      return match;
    });
  }

  function cleanWtsText(text, preserveLeading = false) {
    const plain = String(text ?? '').replace(/\|c[0-9a-fA-F]{6,8}|\|r/g, '');
    const leading = preserveLeading ? (plain.match(/^[ \t]+/) || [''])[0] : '';
    return leading + plain.replace(/\s+/g, ' ').trim();
  }

  function normalizeOriginalForCompare(text) {
    return cleanWtsText(text, true).toLowerCase();
  }

  function buildContentIndex(data) {
    const index = new Map();
    for (const [key, entry] of Object.entries(data)) {
      const c = normalizeOriginalForCompare(entry.original);
      if (!index.has(c)) index.set(c, key);
    }
    return index;
  }

  function buildGroups(dataArray) {
    const map = new Map();
    for (const item of dataArray) {
      const pattern = makePattern(item.original);
      if (!map.has(pattern)) map.set(pattern, []);
      map.get(pattern).push(item);
    }
    const groups = [];
    for (const [pattern, members] of map) {
      members.sort((a, b) => parseInt(a.key) - parseInt(b.key));
      groups.push({ pattern, members });
    }
    groups.sort((a, b) => parseInt(a.members[0].key) - parseInt(b.members[0].key));
    return groups;
  }

  function computeDuplicateGroups(structure) {
    const map = new Map();
    for (const s of structure) {
      if (s.isEmpty) continue;
      const content = stripLineBreaks(s.content == null ? '' : String(s.content));
      if (content === '') continue;
      const norm = normalizeOriginalForCompare(content);
      if (!map.has(norm)) map.set(norm, []);
      map.get(norm).push(String(s.id));
    }
    const result = new Map();
    for (const [norm, ids] of map) if (ids.length > 1) result.set(norm, ids);
    return result;
  }

  function getDuplicatesForKey(key) {
    const item = allData.find(d => d.key === key);
    if (!item) return [];
    const norm = normalizeOriginalForCompare(item.original);
    const ids = duplicateGroups.get(norm) || [];
    return ids.filter(id => id !== String(key));
  }

  function persistDuplicateGroups(groups) {
    const arr = [];
    for (const [, ids] of groups) arr.push({ ids });
    return metadataRef.child('duplicateGroups').set(arr);
  }

  function findAllStructureIndicesByContent(oldContent) {
    const norm = normalizeOriginalForCompare(oldContent);
    const indices = [];
    for (let i = 0; i < lastImportStructure.length; i++) {
      const s = lastImportStructure[i];
      if (s.isEmpty) continue;
      if (normalizeOriginalForCompare(s.content == null ? '' : String(s.content)) === norm) {
        indices.push(i);
      }
    }
    return indices;
  }

  function getCurrentUserInfo() {
    if (currentUser) {
      return { uid: currentUser.uid, displayName: currentDisplayName, role: currentUserRole, canManageDb: currentUserCanManageDb };
    }
    return { uid: null, displayName: 'Аноним', role: 'translator', canManageDb: false };
  }

  // ========== АВТОРИЗАЦИЯ ==========
  function isAuthSupported() {
    try {
      localStorage.setItem('test', 'test');
      localStorage.removeItem('test');
      return window.location.protocol === 'http:' ||
             window.location.protocol === 'https:' ||
             window.location.protocol === 'chrome-extension:';
    } catch (e) { return false; }
  }

  function updateAuthUI(user) {
    if (user) {
      currentUser = user;
      const uid = user.uid;
      usersRef.child(uid).once('value')
        .then((snap) => {
          const data = snap.val() || {};
          let name = data.displayName;
          let role = data.role || 'translator';
          let canManageDb = data.canManageDb === true;
          if (!name) {
            name = user.displayName || 'Аноним';
            usersRef.child(uid).update({ displayName: name }).catch(err => console.warn(err));
          }
          applyUserData(name, role, canManageDb);
        })
        .catch(() => {
          const name = user.displayName || 'Аноним';
          applyUserData(name, 'translator', false);
        });
    } else {
      currentUser = null;
      currentDisplayName = '';
      currentUserRole = 'translator';
      currentUserCanManageDb = false;
      editingOriginalKey = null;
      editOriginalModeCheckbox.checked = false;
      userInfo.textContent = 'Не авторизован';
      roleBadge.style.display = 'none';
      adminBadge.style.display = 'none';
      setNameBtn.style.display = 'none';
      loginGoogleBtn.style.display = 'inline-block';
      logoutBtn.style.display = 'none';
      importBtn.style.display = 'none';
      importTranslationsWtsBtn.style.display = 'none';
      exportBtn.style.display = 'none';
      exportOriginalsBtn.style.display = 'none';
      editOriginalModeLabel.style.display = 'none';
      confirmImportedTranslations.closest('label').style.display = 'none';
      dbDownloadBtn.style.display = 'none';

  function applyUserData(name, role, canManageDb) {

  // ========== ФИЛЬТРАЦИЯ ==========
  function getFilteredData() {
    let filtered = allData;

    if (filterHideUnnecessary.checked) {
      if (importedNumbers.length > 0) {
        const imported = new Set(importedNumbers.map(String));
        filtered = filtered.filter(item => imported.has(String(item.key)));
      }
      filtered = filtered.filter(item => hasRussian(item.original));
      filtered = filtered.filter(item => {
        const comment = (item.wtsComment || '').toLowerCase();
        return !comment.includes('editorsuffix');
      });
    }

    if (filterInactive.checked) {
      filtered = filtered.filter(item => !item.inactive);
    }

    const searchTerm = searchInput.value.trim().toLowerCase();
    if (searchTerm !== '') {
      filtered = filtered.filter(item => {
        const orig = (item.original || '').toLowerCase();
        const trans = (item.translation || '').toLowerCase();
        const wtsComment = (item.wtsComment || '').toLowerCase();
        return orig.includes(searchTerm) || trans.includes(searchTerm) || wtsComment.includes(searchTerm);
      });
    }

    if (filterNoTranslation.checked) {
      filtered = filtered.filter(item => item.translation === '');
    }

    if (filterUnconfirmed.checked) {
      filtered = filtered.filter(item => {
        const hasTranslation = item.translation !== '';
        return hasTranslation && !item.confirmed;
      });
    }

    return filtered;
  }

  function getDisplayItems() {
    const filtered = getFilteredData();
    if (!groupMode.checked) {
      return filtered;
    } else {
      const groups = buildGroups(filtered);
      return groups.map(group => {
        const rep = { ...group.members[0] };
        rep._groupMembers = group.members;
        return rep;
      });
    }
  }

  function getPaginatedData(items) {
    if (itemsPerPage === 0) return items;
    const start = currentPage * itemsPerPage;
    return items.slice(start, start + itemsPerPage);
  }

  function autoResize(textarea) {
    textarea.style.height = 'auto';
    textarea.style.height = textarea.scrollHeight + 'px';
  }

  // ========== СОХРАНЕНИЕ ПЕРЕВОДА ==========
  function saveTranslation(key, newTranslation) {
    const item = allData.find(d => d.key === key);
    if (!item) return;
    const user = getCurrentUserInfo();
    const content = stripLineBreaks(newTranslation);
    const pattern = makePattern(item.original);
    const members = groupMode.checked
      ? allData.filter(m => makePattern(m.original) === pattern) : [item];
    const updates = {};
    for (const member of members) {
      const translation = stripLineBreaks(member.key === key
        ? content : applyTranslationToMember(content, member.original));
      const update = {
        translation,
        translationAuthor: translation === '' ? '' : user.uid,
        translationAuthorName: translation === '' ? '' : user.displayName,
        confirmed: false,
        confirmedBy: '',
        confirmedByName: ''
        // lastConfirmed* поля НЕ трогаем — они сохраняют последнюю утверждённую версию
      };
      for (const [field, value] of Object.entries(update)) {
        updates[`${member.key}/${field}`] = value;
      }
    }
    stringsRef.update(updates).catch(err => alert('Ошибка сохранения: ' + err.message));
  }

  // ========== ПОДТВЕРЖДЕНИЕ ПЕРЕВОДА ==========
  function handleConfirmToggle(e) {
    const btn = e.currentTarget;
    const key = btn.dataset.key;
    const item = allData.find(d => d.key === key);
    if (!item) return;
    if (item.translation === '') {
      alert('Невозможно подтвердить: перевод отсутствует.');
      return;
    }
    const user = getCurrentUserInfo();
    if (user.role !== 'editor') {
      alert('Только редакторы могут подтверждать переводы.');
      return;
    }
    const newConfirmed = !item.confirmed;
    const updateData = {
      confirmed: newConfirmed,
      confirmedBy: newConfirmed ? user.uid : null,
      confirmedByName: newConfirmed ? user.displayName : null
    };

    if (newConfirmed) {
      // Сохраняем текущий перевод как последний подтверждённый
      updateData.lastConfirmedTranslation = item.translation;
      updateData.lastConfirmedTranslationAuthor = item.translationAuthor || '';
      updateData.lastConfirmedTranslationAuthorName = item.translationAuthorName || '';
      updateData.lastConfirmedBy = user.uid;
      updateData.lastConfirmedByName = user.displayName;
      updateData.lastConfirmedAt = Date.now();
    }
    // При снятии подтверждения lastConfirmed* остаются нетронутыми

    stringsRef.child(key).update(updateData)
      .then(() => {
        item.confirmed = newConfirmed;
        item.confirmedBy = newConfirmed ? user.uid : null;
        item.confirmedByName = newConfirmed ? user.displayName : null;
        if (newConfirmed) {
          item.lastConfirmedTranslation = item.translation;
          item.lastConfirmedTranslationAuthor = item.translationAuthor || '';
          item.lastConfirmedTranslationAuthorName = item.translationAuthorName || '';
          item.lastConfirmedBy = user.uid;
          item.lastConfirmedByName = user.displayName;
          item.lastConfirmedAt = Date.now();
        }
        render();
      })
      .catch(err => alert('Ошибка обновления подтверждения: ' + err.message));
  }

  // ========== ПОСЛЕДНИЙ ПОДТВЕРЖДЁННЫЙ ПЕРЕВОД ==========
  function showLastConfirmedModal(key) {
    const item = allData.find(d => d.key === key);
    if (!item || !item.lastConfirmedTranslation) {
      alert('Для этой фразы ещё нет сохранённого последнего подтверждённого перевода.');
      return;
    }
    const currentTranslation = item.translation || '';
    const lastConfirmed = item.lastConfirmedTranslation;
    const confirmedBy = item.lastConfirmedByName || 'Аноним';
    const confirmedAt = item.lastConfirmedAt ? formatTimestamp(item.lastConfirmedAt) : '';
    const lastAuthorName = item.lastConfirmedTranslationAuthorName || '';
    const isSame = currentTranslation === lastConfirmed;
    const needsRestore = !isSame || !item.confirmed;

    lastConfirmedTitle.textContent = `Последний подтверждённый перевод #${key}`;

    let html = `
      <div class="modal-item">
        <div style="font-size: 12px; color: #666; margin-bottom: 4px;">📝 Текущий перевод:</div>
        <div class="last-confirmed-block ${isSame ? 'confirmed-now' : ''}">
          ${escapeHtml(currentTranslation || '(пусто)')}
        </div>
        ${item.confirmed ? '<div class="last-confirmed-meta" style="color:#2e7d32;">✅ Подтверждён</div>' : ''}
      </div>
      <div class="modal-item">
        <div style="font-size: 12px; color: #666; margin-bottom: 4px;">📜 Последний подтверждённый:</div>
        <div class="last-confirmed-block confirmed-now">${escapeHtml(lastConfirmed)}</div>
        <div class="last-confirmed-meta">✅ Подтвердил: ${escapeHtml(confirmedBy)}${confirmedAt ? ' — ' + confirmedAt : ''}</div>
        ${lastAuthorName ? `<div class="last-confirmed-meta">✍️ Автор перевода: ${escapeHtml(lastAuthorName)}</div>` : ''}
      </div>
      <div style="margin-top: 16px; text-align: center;">
        ${needsRestore
          ? `<button class="restore-last-confirmed-btn" data-key="${escapeHtml(key)}">↩️ Восстановить и подтвердить</button>`
          : `<div style="color: #2e7d32; font-size: 13px;">Текущий перевод уже совпадает с последним подтверждённым.</div>`}
      </div>
    `;
    lastConfirmedContent.innerHTML = html;
    lastConfirmedModal.classList.add('active');
  }

  function restoreLastConfirmed(key) {
    const item = allData.find(d => d.key === key);
    if (!item || !item.lastConfirmedTranslation) return;
    const confirmedBy = item.lastConfirmedByName || 'Аноним';
    if (!confirm(
      `Восстановить последний подтверждённый перевод?\n\n` +
      `Текущий: "${item.translation || '(пусто)'}"\n` +
      `Будет заменён на: "${item.lastConfirmedTranslation}"\n\n` +
      `Статус: ✅ подтверждён (${confirmedBy})`
    )) return;

    const updates = {
      translation: item.lastConfirmedTranslation,
      translationAuthor: item.lastConfirmedTranslationAuthor || '',
      translationAuthorName: item.lastConfirmedTranslationAuthorName || '',
      confirmed: true,
      confirmedBy: item.lastConfirmedBy || '',
      confirmedByName: item.lastConfirmedByName || ''
      // lastConfirmed* не трогаем — они и так указывают на это значение
    };

    stringsRef.child(key).update(updates)
      .then(() => {
        item.translation = item.lastConfirmedTranslation;
        item.translationAuthor = item.lastConfirmedTranslationAuthor || '';
        item.translationAuthorName = item.lastConfirmedTranslationAuthorName || '';
        item.confirmed = true;
        item.confirmedBy = item.lastConfirmedBy || '';
        item.confirmedByName = item.lastConfirmedByName || '';
        lastConfirmedModal.classList.remove('active');
        render();
      })
      .catch(err => alert('Ошибка восстановления: ' + err.message));
  }

  lastConfirmedClose.addEventListener('click', () => lastConfirmedModal.classList.remove('active'));
  lastConfirmedModal.addEventListener('click', (e) => {
    if (e.target === lastConfirmedModal) lastConfirmedModal.classList.remove('active');
  });
  lastConfirmedContent.addEventListener('click', (e) => {
    const btn = e.target.closest('.restore-last-confirmed-btn');
    if (btn && btn.dataset.key) restoreLastConfirmed(btn.dataset.key);
  });

  // ========== РЕДАКТИРОВАНИЕ ОРИГИНАЛА ==========
  function saveOriginalEdit(key, newOriginal) {
    const user = getCurrentUserInfo();
    if (user.role !== 'editor') {
      alert('Только редакторы могут изменять оригинальные фразы.');
      return;
    }

    const item = allData.find(d => d.key === key);
    if (!item) return;

    const newContent = stripLineBreaks(newOriginal);
    const oldOriginal = item.original || '';
    const oldContent = stripLineBreaks(oldOriginal);

    if (newContent === oldContent) {
      editingOriginalKey = null;
      render();
      return;
    }

    if (newContent === '') {
      if (!confirm('Оригинал станет пустым. При экспорте будет выведена пустая строка. Продолжить?')) return;
    }

    const oldNorm = normalizeOriginalForCompare(oldContent);
    const newNorm = normalizeOriginalForCompare(newContent);
    const structIndices = findAllStructureIndicesByContent(oldContent);

    let existingKey = null;
    if (newContent !== '' && oldNorm !== newNorm) {
      existingKey = allData.find(d =>
        d.key !== key && normalizeOriginalForCompare(d.original) === newNorm);
    }

    const updates = {};

    if (existingKey) {
      const targetKey = existingKey.key;
      const target = existingKey;
      if (!confirm(
        `Фраза с таким оригиналом уже существует (#${targetKey}).\n` +
        `Произойдёт слияние: #${key} будет удалена, её перевод и комментарии перейдут в #${targetKey}.\n\nПродолжить?`
      )) return;

      if (!target.translation && item.translation) {
        updates[`strings/${targetKey}/translation`] = item.translation;
        updates[`strings/${targetKey}/translationAuthor`] = item.translationAuthor || '';
        updates[`strings/${targetKey}/translationAuthorName`] = item.translationAuthorName || '';
        updates[`strings/${targetKey}/confirmed`] = item.confirmed || false;
        updates[`strings/${targetKey}/confirmedBy`] = item.confirmedBy || '';
        updates[`strings/${targetKey}/confirmedByName`] = item.confirmedByName || '';
        if (item.lastConfirmedTranslation) {
          updates[`strings/${targetKey}/lastConfirmedTranslation`] = item.lastConfirmedTranslation;
          updates[`strings/${targetKey}/lastConfirmedTranslationAuthor`] = item.lastConfirmedTranslationAuthor || '';
          updates[`strings/${targetKey}/lastConfirmedTranslationAuthorName`] = item.lastConfirmedTranslationAuthorName || '';
          updates[`strings/${targetKey}/lastConfirmedBy`] = item.lastConfirmedBy || '';
          updates[`strings/${targetKey}/lastConfirmedByName`] = item.lastConfirmedByName || '';
          updates[`strings/${targetKey}/lastConfirmedAt`] = item.lastConfirmedAt || 0;
        }
      } else if (target.translation && item.translation && target.translation !== item.translation) {
        const useSource = confirm(
          `У #${targetKey} перевод: "${target.translation}"\n` +
          `У #${key} перевод: "${item.translation}"\n\n` +
          `Использовать перевод из #${key}? (Отмена — оставить перевод #${targetKey})`
        );
        if (useSource) {
          updates[`strings/${targetKey}/translation`] = item.translation;
          updates[`strings/${targetKey}/translationAuthor`] = item.translationAuthor || '';
          updates[`strings/${targetKey}/translationAuthorName`] = item.translationAuthorName || '';
          updates[`strings/${targetKey}/confirmed`] = item.confirmed || false;
          updates[`strings/${targetKey}/confirmedBy`] = item.confirmedBy || '';
          updates[`strings/${targetKey}/confirmedByName`] = item.confirmedByName || '';
          if (item.lastConfirmedTranslation) {
            updates[`strings/${targetKey}/lastConfirmedTranslation`] = item.lastConfirmedTranslation;
            updates[`strings/${targetKey}/lastConfirmedTranslationAuthor`] = item.lastConfirmedTranslationAuthor || '';
            updates[`strings/${targetKey}/lastConfirmedTranslationAuthorName`] = item.lastConfirmedTranslationAuthorName || '';
            updates[`strings/${targetKey}/lastConfirmedBy`] = item.lastConfirmedBy || '';
            updates[`strings/${targetKey}/lastConfirmedByName`] = item.lastConfirmedByName || '';
            updates[`strings/${targetKey}/lastConfirmedAt`] = item.lastConfirmedAt || 0;
          }
        }
      }

      const targetComments = target.userComments || [];
      const sourceComments = item.userComments || [];
      if (sourceComments.length > 0) {
        updates[`strings/${targetKey}/userComments`] =
          [...targetComments, ...sourceComments].slice(-50);
      }

      updates[`strings/${key}`] = null;

      for (const idx of structIndices) {
        updates[`metadata/lastImportStructure/${idx}/content`] = newContent;
        updates[`metadata/lastImportStructure/${idx}/isEmpty`] = newContent === '';
      }
    } else {
      updates[`strings/${key}/original`] = newContent;
      updates[`strings/${key}/originalEditedBy`] = user.uid;
      updates[`strings/${key}/originalEditedByName`] = user.displayName;
      updates[`strings/${key}/originalEditedAt`] = Date.now();

      if (oldNorm !== newNorm && item.translation) {
        updates[`strings/${key}/confirmed`] = false;
        updates[`strings/${key}/confirmedBy`] = '';
        updates[`strings/${key}/confirmedByName`] = '';
      }

      for (const idx of structIndices) {
        updates[`metadata/lastImportStructure/${idx}/content`] = newContent;
        updates[`metadata/lastImportStructure/${idx}/isEmpty`] = newContent === '';
      }
    }

    db.ref().update(updates)
      .then(() => {
        if (existingKey) {
          allData = allData.filter(d => d.key !== key);
          const targetItem = allData.find(d => d.key === existingKey.key);
          if (targetItem) {
            if (!targetItem.translation && item.translation) {
              targetItem.translation = item.translation;
              targetItem.translationAuthor = item.translationAuthor;
              targetItem.translationAuthorName = item.translationAuthorName;
              targetItem.confirmed = item.confirmed;
              targetItem.confirmedBy = item.confirmedBy;
              targetItem.confirmedByName = item.confirmedByName;
              if (item.lastConfirmedTranslation) {
                targetItem.lastConfirmedTranslation = item.lastConfirmedTranslation;
                targetItem.lastConfirmedTranslationAuthor = item.lastConfirmedTranslationAuthor;
                targetItem.lastConfirmedTranslationAuthorName = item.lastConfirmedTranslationAuthorName;
                targetItem.lastConfirmedBy = item.lastConfirmedBy;
                targetItem.lastConfirmedByName = item.lastConfirmedByName;
                targetItem.lastConfirmedAt = item.lastConfirmedAt;
              }
            }
            if (item.userComments && item.userComments.length > 0) {
              targetItem.userComments =
                [...(targetItem.userComments || []), ...item.userComments].slice(-50);
            }
          }
        } else {
          item.original = newContent;
          item.originalEditedBy = user.uid;
          item.originalEditedByName = user.displayName;
          item.originalEditedAt = Date.now();
          if (oldNorm !== newNorm && item.translation) {
            item.confirmed = false;
            item.confirmedBy = '';
            item.confirmedByName = '';
          }
        }
        for (const idx of structIndices) {
          lastImportStructure[idx] = {
            ...lastImportStructure[idx],
            content: newContent,
            isEmpty: newContent === ''
          };
        }
        duplicateGroups = computeDuplicateGroups(lastImportStructure);
        persistDuplicateGroups(duplicateGroups).catch(err => console.warn('duplicateGroups:', err));
        editingOriginalKey = null;
        render();
      })
      .catch(err => alert('Ошибка сохранения оригинала: ' + err.message));
  }

  // ========== НЕАКТИВНОСТЬ ==========
  function toggleInactive(key) {
    const item = allData.find(d => d.key === key);
    if (!item) return;

    const newState = !item.inactive;
    const targetNorm = normalizeOriginalForCompare(item.original);

    const matchingKeys = allData
      .filter(d => normalizeOriginalForCompare(d.original) === targetNorm)
      .map(d => d.key);

    if (matchingKeys.length === 0) return;

    for (const k of matchingKeys) {
      const local = allData.find(d => d.key === k);
      if (local) local.inactive = newState;
    }

    const updates = {};
    for (const k of matchingKeys) updates[k + '/inactive'] = newState;

    stringsRef.update(updates)
      .then(() => { render(); })
      .catch(err => alert('Ошибка обновления статуса: ' + err.message));
  }

  // ========== ПОХОЖИЕ ==========
  function findSimilarConfirmedTranslations(original, excludeKey, maxResults = 5) {
    const words = text => text.toLowerCase().replace(/[^a-zа-яё\s]/g, '').split(/\s+/).filter(w => w.length > 2);
    const currentWords = words(original);
    if (currentWords.length === 0) return [];
    const results = [];
    const currentNormalized = normalizeOriginalForCompare(original);

    for (const entry of allData) {
      if (entry.key === excludeKey) continue;
      if (!entry.confirmed) continue;
      if (!entry.translation || entry.translation === '') continue;
      if (normalizeOriginalForCompare(entry.original) === currentNormalized) continue;

      const entryWords = words(entry.original);
      const common = currentWords.filter(w => entryWords.includes(w));
      if (common.length === 0) continue;
      const union = new Set([...currentWords, ...entryWords]);
      const score = common.length / union.size;
      results.push({
        key: entry.key,
        original: entry.original,
        translation: entry.translation,
        commonWords: common,
        score: score
      });
    }
    results.sort((a, b) => b.score - a.score);
    return results.slice(0, maxResults);
  }

  function showSimilarTranslations(key) {
    const item = allData.find(d => d.key === key);
    if (!item) return;
    const similar = findSimilarConfirmedTranslations(item.original, key);
    if (similar.length === 0) {
      alert('Нет похожих подтверждённых переводов.');
      return;
    }
    similarModalTitle.textContent = `Похожие подтверждённые переводы для #${key}`;
    let html = '';
    for (const s of similar) {
      const words = s.original.split(/\s+/);
      const highlighted = words.map(w => {
        const clean = w.replace(/[^a-zа-яё0-9]/gi, '');
        if (s.commonWords.includes(clean.toLowerCase())) {
          return `<strong>${escapeHtml(w)}</strong>`;
        }
        return escapeHtml(w);
      }).join(' ');
      html += `
        <div class="modal-item">
          <div class="modal-header">
            <span class="modal-key">#${s.key}</span>
            <span class="modal-score">Сходство: ${(s.score * 100).toFixed(0)}%</span>
          </div>
          <div class="modal-original">${highlighted}</div>
          <div class="modal-translation">Перевод: ${escapeHtml(s.translation)}</div>
        </div>
      `;
    }
    similarModalList.innerHTML = html;
    similarModal.classList.add('active');
  }

  similarModalClose.addEventListener('click', () => { similarModal.classList.remove('active'); });
  similarModal.addEventListener('click', (e) => {
    if (e.target === similarModal) similarModal.classList.remove('active');
  });

  // ========== РЕНДЕРИНГ ==========

      } else if (currentPage >= totalPages) {

      }
      const pageItems = getPaginatedData(displayItems);

      pageInfo.textContent = totalDisplay === 0 ? '0 / 0' : `${curPageDisplay} / ${totalPages}`;

      prevPageBtn.disabled = currentPage === 0 || totalDisplay === 0;

      let statsText = `Всего: ${totalAll} | Отфильтровано: ${filteredCount} | Показано: ${totalDisplay}`;

        if (groupMode.checked && item._groupMembers && item._groupMembers.length > 1) {

        }

          }

          }

        const commentInputHtml = `

          <button class="comment-save-btn" data-key="${safeKey}">Отправить</button>
        `;

        let entryClasses = 'entry';
        if (inactive) entryClasses += ' inactive';

        let leftColHtml;
        if (isEditMode) {
          if (editingOriginalKey === key) {

            `;

              <div class="left-col">
                <div class="meta">#${key}</div>
                <div class="original">${escapeHtml(original)}</div>
                <button class="original-edit-btn" data-key="${safeKey}">✏️ Изменить оригинал</button>
                ${groupInfo ? `<div class="group-info">${groupInfo}</div>` : ''}
                ${duplicateInfo}
                ${originalAuthorInfo}
              </div>
            `;
          }
        } else {
          leftColHtml = `
            <div class="left-col">
              <div class="meta">#${key}</div>
              <div class="original">${escapeHtml(original)}</div>
              ${groupInfo ? `<div class="group-info">${groupInfo}</div>` : ''}

        const rightColHtml = `
          <div class="right-col">
            <div class="translation-row">
              <textarea class="translation-input" rows="1" data-key="${safeKey}" placeholder="Введите перевод... (Ctrl+Enter — сохранить)">${escapeHtml(translation)}</textarea>
              <button class="save-translation-btn" data-key="${safeKey}">Сохранить перевод</button>
            </div>
            <div class="author-info">
              ${translationAuthorDisplay ? `<span>${translationAuthorDisplay}</span>` : ''}
              ${confirmedDisplay}
              ${confirmButton}
              ${inactiveButton}
              ${similarButton}
              ${lastConfirmedButton}
            </div>
          </div>
        `;

        html += `
          <div class="${entryClasses}" data-key="${safeKey}">
            ${leftColHtml}
            ${rightColHtml}
            <div class="comment-section">
              ${commentHtml}
              ${commentInputHtml}
            </div>
          </div>
        `;
      }
      container.innerHTML = html;
      countStatus.textContent = totalDisplay;

      const bindings = {
        '.translation-input': { input: handleTextareaInput, keydown: handleTextareaKeydown },
        '.save-translation-btn': { click: handleSaveTranslation },
        '.comment-save-btn': { click: handleCommentSave },
        '.confirm-btn': { click: handleConfirmToggle },
        '.inactive-btn': { click: handleInactiveToggle },
        '.similar-btn': { click: handleSimilar },
        '.last-confirmed-btn': { click: handleLastConfirmedClick },
        '.original-edit-btn': { click: handleOriginalEditClick },
        '.original-save-btn': { click: handleOriginalSaveClick },
        '.original-cancel-btn': { click: handleOriginalCancelClick }
      };
      for (const [selector, events] of Object.entries(bindings)) {
        for (const element of container.querySelectorAll(selector)) {
          if (selector === '.translation-input') autoResize(element);
          for (const [event, handler] of Object.entries(events)) element.addEventListener(event, handler);
        }
      }
      container.querySelectorAll('.original-edit-input').forEach(textarea => {
        autoResize(textarea);
        textarea.addEventListener('input', () => autoResize(textarea));
        textarea.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            saveOriginalEdit(textarea.dataset.key, textarea.value);
          } else if (e.key === 'Escape') {
            e.preventDefault();
            editingOriginalKey = null;
            render();
          }
        });
        if (editingOriginalKey === textarea.dataset.key) textarea.focus();
      });
    } catch (err) {
      console.error('Ошибка при рендеринге:', err);
      container.innerHTML = `<div class="loader" style="color:#c62828;">Ошибка отображения: ${err.message}</div>`;
    }
  }

    const entry = btn.closest('.entry');

    };

      .then(() => {
