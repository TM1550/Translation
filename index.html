<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Перевод .wts – совместный словарь</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .app {
      max-width: 900px;
      width: 100%;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; color: #1a237e; margin-bottom: 20px; }
    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      align-items: center;
    }
    .toolbar button {
      padding: 8px 20px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      background: #0d47a1;
      color: white;
      transition: 0.2s;
    }
    .toolbar button:hover { background: #1565c0; }
    .toolbar .export-btn { background: #2e7d32; }
    .toolbar .export-btn:hover { background: #388e3c; }
    .toolbar .import-label {
      background: #e65100;
      color: white;
      padding: 8px 20px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-block;
    }
    .toolbar .import-label:hover { background: #bf360c; }
    #fileInput { display: none; }
    .stats {
      margin-left: auto;
      font-size: 14px;
      color: #555;
    }
    .entry {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 8px 12px;
      padding: 12px 14px;
      background: #f8f9fa;
      border-radius: 8px;
      border-left: 4px solid #0d47a1;
      margin-bottom: 8px;
    }
    .entry .meta {
      font-size: 13px;
      color: #888;
      min-width: 60px;
    }
    .entry .comment {
      font-size: 13px;
      color: #5d4037;
      background: #fff3e0;
      padding: 2px 8px;
      border-radius: 12px;
      display: inline-block;
    }
    .entry .original {
      flex: 1 1 100%;
      font-weight: 500;
      padding: 4px 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .entry .translation-input {
      flex: 2 1 200px;
      padding: 6px 10px;
      border: 1px solid #cfd8dc;
      border-radius: 6px;
      font-size: 15px;
      min-width: 150px;
    }
    .entry .translation-input:focus {
      border-color: #0d47a1;
      outline: none;
    }
    .entry .delete-btn {
      background: #e53935;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    .entry .delete-btn:hover { background: #c62828; }
    .dictionary {
      max-height: 600px;
      overflow-y: auto;
    }
    .loader {
      text-align: center;
      padding: 20px;
      color: #888;
    }
    .status {
      margin-top: 16px;
      font-size: 14px;
      color: #546e7a;
      border-top: 1px solid #ecf0f1;
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
    }
    .status .online { color: #2e7d32; font-weight: 600; }
    .error-message { color: #c62828; }
  </style>
</head>
<body>
<div class="app">
  <h1>📚 Перевод .wts – совместная работа</h1>

  <div class="toolbar">
    <button id="refreshBtn">🔄 Обновить</button>
    <label class="import-label" id="importLabel">📂 Загрузить .wts</label>
    <input type="file" id="fileInput" accept=".wts" />
    <button class="export-btn" id="exportBtn">⬇ Скачать .wts</button>
    <span class="stats" id="stats">Записей: 0</span>
  </div>

  <div id="dictionaryContainer" class="dictionary">
    <div class="loader">Загрузка словаря...</div>
  </div>

  <div class="status">
    <span id="connectionStatus">⏳ Подключение...</span>
    <span id="countStatus">0</span>
  </div>
</div>

<script>
  // ============ КОНФИГУРАЦИЯ FIREBASE (ЗАМЕНИТЕ) ============
  const firebaseConfig = {
    apiKey: "AIzaSyATbe93bnOiAQmdTUX1dh22UXwtA_dbMWI",
    authDomain: "translatorapp-6fd48.firebaseapp.com",
    databaseURL: "https://translatorapp-6fd48-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "translatorapp-6fd48",
    storageBucket: "translatorapp-6fd48.firebasestorage.app",
    messagingSenderId: "428558181807",
    appId: "1:428558181807:web:b891cd4d29c8b985eebb5a"
  };
  // =============================================================

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const stringsRef = db.ref('strings');

  // DOM элементы
  const container = document.getElementById('dictionaryContainer');
  const statsSpan = document.getElementById('stats');
  const countStatus = document.getElementById('countStatus');
  const connectionStatus = document.getElementById('connectionStatus');
  const fileInput = document.getElementById('fileInput');
  const exportBtn = document.getElementById('exportBtn');
  const refreshBtn = document.getElementById('refreshBtn');

  // Состояние подключения
  const connectedRef = firebase.database().ref('.info/connected');
  connectedRef.on('value', (snap) => {
    if (snap.val()) {
      connectionStatus.innerHTML = '✅ Подключено к Firebase';
      connectionStatus.style.color = '#2e7d32';
    } else {
      connectionStatus.innerHTML = '❌ Офлайн (изменения сохранятся позже)';
      connectionStatus.style.color = '#e53935';
    }
  });

  // ========== СЛУШАЕМ ИЗМЕНЕНИЯ В РЕАЛЬНОМ ВРЕМЕНИ ==========
  stringsRef.on('value', (snapshot) => {
    const data = snapshot.val();
    if (!data) {
      container.innerHTML = '<div class="loader">Словарь пуст. Загрузите .wts или добавьте вручную.</div>';
      statsSpan.textContent = 'Записей: 0';
      countStatus.textContent = '0';
      return;
    }
    // Преобразуем объект в массив и сортируем по номеру (ключу)
    const entries = Object.entries(data).sort((a, b) => parseInt(a[0]) - parseInt(b[0]));
    statsSpan.textContent = `Записей: ${entries.length}`;
    countStatus.textContent = entries.length;

    let html = '';
    for (const [key, entry] of entries) {
      const original = entry.original || '';
      const translation = entry.translation || '';
      const comment = entry.comment || '';
      const safeKey = key.replace(/"/g, '&quot;');
      html += `
        <div class="entry" data-key="${safeKey}">
          <span class="meta">#${key}</span>
          ${comment ? `<span class="comment">${escapeHtml(comment)}</span>` : ''}
          <div class="original">${escapeHtml(original)}</div>
          <input class="translation-input" type="text" value="${escapeHtml(translation)}" data-key="${safeKey}" placeholder="Введите перевод...">
          <button class="delete-btn" data-key="${safeKey}">✕</button>
        </div>
      `;
    }
    container.innerHTML = html;

    // Обработчики изменения перевода (сохранение в Firebase)
    container.querySelectorAll('.translation-input').forEach(input => {
      const key = input.dataset.key;
      input.addEventListener('change', function(e) {
        const newTranslation = e.target.value.trim();
        if (newTranslation === '') {
          alert('Перевод не может быть пустым. Чтобы удалить запись, используйте кнопку ✕.');
          e.target.value = data[key]?.translation || '';
          return;
        }
        // Обновляем только поле translation
        stringsRef.child(key).update({ translation: newTranslation })
          .catch(err => alert('Ошибка сохранения: ' + err.message));
      });
      // Также сохраняем при потере фокуса (если не изменилось, ничего не делаем)
      input.addEventListener('blur', function(e) {
        // Уже обработано change
      });
    });

    // Обработчики удаления
    container.querySelectorAll('.delete-btn').forEach(btn => {
      const key = btn.dataset.key;
      btn.addEventListener('click', function() {
        if (confirm(`Удалить строку #${key}?`)) {
          stringsRef.child(key).remove()
            .catch(err => alert('Ошибка удаления: ' + err.message));
        }
      });
    });
  });

  // ========== ИМПОРТ .WTS ==========
  function parseWTS(text) {
    // Регулярное выражение для поиска блоков:
    // STRING номер [ // комментарий ] \n? { текст }
    // Комментарий может отсутствовать.
    const regex = /STRING\s+(\d+)\s*(?:\/\/\s*([^\n]*))?\s*\{([\s\S]*?)\}/g;
    const entries = [];
    let match;
    while ((match = regex.exec(text)) !== null) {
      const number = match[1];
      const comment = (match[2] || '').trim();
      const content = match[3].trim();
      entries.push({ number, comment, content });
    }
    return entries;
  }

  function importWTS(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const text = e.target.result;
      const parsed = parseWTS(text);
      if (parsed.length === 0) {
        alert('Не удалось найти ни одной строки STRING в файле. Проверьте формат.');
        return;
      }
      // Подтверждение перед импортом (перезапишет существующие строки с такими номерами)
      if (!confirm(`Найдено ${parsed.length} строк. Импортировать? (строки с существующими номерами будут перезаписаны)`)) return;

      // Загружаем все в Firebase (обновляем)
      const updates = {};
      for (const item of parsed) {
        updates[item.number] = {
          original: item.content,
          translation: '',
          comment: item.comment
        };
      }
      stringsRef.update(updates)
        .then(() => {
          alert(`Импортировано ${parsed.length} строк.`);
        })
        .catch(err => alert('Ошибка импорта: ' + err.message));
    };
    reader.onerror = function() {
      alert('Ошибка чтения файла');
    };
    reader.readAsText(file, 'UTF-8');
  }

  fileInput.addEventListener('change', function(e) {
    if (this.files && this.files[0]) {
      importWTS(this.files[0]);
    }
    this.value = ''; // сброс, чтобы можно было загрузить тот же файл повторно
  });

  // ========== ЭКСПОРТ .WTS ==========
  function generateWTS(data) {
    // data – объект { номер: { original, translation, comment } }
    const keys = Object.keys(data).sort((a, b) => parseInt(a) - parseInt(b));
    let output = '';
    for (const key of keys) {
      const entry = data[key];
      const original = entry.original || '';
      const translation = entry.translation || '';
      // При экспорте мы пишем переведённый текст (если есть), иначе оригинал.
      // По логике, пользователь хочет получить .wts с переведёнными строками, поэтому используем translation, если он не пуст.
      const textToWrite = translation.trim() !== '' ? translation : original;
      const comment = entry.comment || '';
      output += `STRING ${key}`;
      if (comment) {
        output += ` // ${comment}`;
      }
      output += `\n{\n${textToWrite}\n}\n\n`;
    }
    return output;
  }

  function exportWTS() {
    stringsRef.once('value', (snapshot) => {
      const data = snapshot.val();
      if (!data || Object.keys(data).length === 0) {
        alert('Нет данных для экспорта.');
        return;
      }
      const wtsText = generateWTS(data);
      // Создаём файл для скачивания
      const blob = new Blob([wtsText], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'translated_strings.wts';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  }

  exportBtn.addEventListener('click', exportWTS);

  // ========== ОБНОВИТЬ (рефреш) ==========
  refreshBtn.addEventListener('click', () => {
    stringsRef.once('value', (snap) => {
      const data = snap.val();
      const count = data ? Object.keys(data).length : 0;
      countStatus.textContent = count;
    });
  });

  // ========== ВСПОМОГАТЕЛЬНАЯ ФУНКЦИЯ ==========
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ========== ИНИЦИАЛИЗАЦИЯ ==========
  // При первом запуске, если база пуста, можно ничего не делать.
  console.log('Приложение готово.');
</script>
</body>
</html>
