  commentsModal.addEventListener('click', (e) => {
    if (e.target === commentsModal) commentsModal.classList.remove('active');
  });

  // ========== ПАРСИНГ WTS ==========
  function parseWTS(text) {
    if (text && text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const regex = /(?:\/\/[ \t]*([^\n]*)[ \t]*\r?\n[ \t]*)?STRING[ \t]+(\d+)(?:[ \t]*\/\/[ \t]*([^\n]*))?[ \t]*(?:\r?\n[ \t]*\/\/[ \t]*([^\n]*))?[ \t]*\r?\n?[ \t]*\{([\s\S]*?)\}/g;
    const entries = [];
    let match;
    while ((match = regex.exec(text)) !== null) {
      const commentPrefix = match[1];
      const number = match[2];
      const commentInline = match[3];
      const commentPostfix = match[4];
      const content = match[5];
      const comment = (commentPostfix || commentInline || commentPrefix || '').trim();
      const contentStripped = stripLineBreaks(content);
      entries.push({
        number,
        comment,
        content: contentStripped,
        isEmpty: contentStripped === ''
      });
    }
    return entries;
  }

  // ========== ИМПОРТ ОРИГИНАЛОВ ==========
  function importWTS(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const text = e.target.result;
        const allParsed = parseWTS(text);
        const parsed = allParsed.filter(p => !p.isEmpty);
        const emptyParsed = allParsed.filter(p => p.isEmpty);

        if (allParsed.length === 0) {
          alert('Не удалось найти ни одной строки STRING в файле.');
          return;
        }

        const confirmMsg = emptyParsed.length > 0
          ? `Найдено ${parsed.length} непустых и ${emptyParsed.length} пустых строк.\nПустые строки будут запомнены и выведены при экспорте.\nИмпортировать?`
          : `Найдено ${parsed.length} непустых строк. Импортировать?`;
        if (!window.confirm(confirmMsg)) return;

        const norm = normalizeOriginalForCompare;
        const inactiveByContent = new Map();
        for (const item of allData) {
          if (item.inactive) inactiveByContent.set(norm(item.original), true);
        }

        const parsedByTarget = new Map();
        for (const p of parsed) parsedByTarget.set(String(p.number), p);
        const parsedByContent = new Map();
        for (const p of parsedByTarget.values()) parsedByContent.set(norm(p.content), p);

        const existingByContent = new Map();
        for (const item of allData) {
          const c = norm(item.original);
          if (!existingByContent.has(c)) existingByContent.set(c, item);
        }

        const replacedContents = new Set(parsedByContent.keys());
        const finalMap = new Map();
        for (const item of allData) {
          const c = norm(item.original);
          if (replacedContents.has(c)) continue;
          finalMap.set(item.key, { ...item });
        }

        const reservedIds = new Set();
        for (const p of allParsed) reservedIds.add(String(p.number));

        let maxId = 0;
        for (const k of finalMap.keys()) maxId = Math.max(maxId, parseInt(k) || 0);
        for (const k of reservedIds) maxId = Math.max(maxId, parseInt(k) || 0);

        const itemsToRelocate = [];
        for (const [key, item] of finalMap) {
          if (reservedIds.has(String(key))) {
            itemsToRelocate.push(item);
            finalMap.delete(key);
          }
        }

        let nextId = maxId + 1;
        for (const item of itemsToRelocate) {
          while (reservedIds.has(String(nextId)) || finalMap.has(String(nextId))) nextId++;
          finalMap.set(String(nextId), { ...item, key: String(nextId) });
          nextId++;
        }

        for (const p of parsedByContent.values()) {
          const c = norm(p.content);
          const existing = existingByContent.get(c);
          const targetKey = String(p.number);
          const inactiveFinal = inactiveByContent.has(c);

          finalMap.set(targetKey, {
            key: targetKey,
            original: p.content,
            translation: existing ? (existing.translation || '') : '',
            translationAuthor: existing ? (existing.translationAuthor || '') : '',
            translationAuthorName: existing ? (existing.translationAuthorName || '') : '',
            wtsComment: p.comment || '',
            userComments: existing ? (existing.userComments || []) : [],
            confirmed: existing ? (existing.confirmed || false) : false,
            confirmedBy: existing ? (existing.confirmedBy || '') : '',
            confirmedByName: existing ? (existing.confirmedByName || '') : '',
            inactive: inactiveFinal,
            lastConfirmedTranslation: existing ? (existing.lastConfirmedTranslation || '') : '',
            lastConfirmedTranslationAuthor: existing ? (existing.lastConfirmedTranslationAuthor || '') : '',
            lastConfirmedTranslationAuthorName: existing ? (existing.lastConfirmedTranslationAuthorName || '') : '',
            lastConfirmedBy: existing ? (existing.lastConfirmedBy || '') : '',
            lastConfirmedByName: existing ? (existing.lastConfirmedByName || '') : '',
            lastConfirmedAt: existing ? (existing.lastConfirmedAt || 0) : 0,
            originalEditedBy: existing ? (existing.originalEditedBy || '') : '',
            originalEditedByName: existing ? (existing.originalEditedByName || '') : '',
            originalEditedAt: existing ? (existing.originalEditedAt || 0) : 0
          });
        }

        const updates = {};
        for (const item of allData) {
          if (!finalMap.has(item.key)) updates[item.key] = null;
        }
        for (const [key, item] of finalMap) {
          updates[key] = {
            original: item.original || '',
            translation: item.translation || '',
            translationAuthor: item.translationAuthor || '',
            translationAuthorName: item.translationAuthorName || '',
            wtsComment: item.wtsComment || '',
            userComments: item.userComments || [],
            confirmed: item.confirmed || false,
            confirmedBy: item.confirmedBy || '',
            confirmedByName: item.confirmedByName || '',
            inactive: item.inactive || false,
            lastConfirmedTranslation: item.lastConfirmedTranslation || '',
            lastConfirmedTranslationAuthor: item.lastConfirmedTranslationAuthor || '',
            lastConfirmedTranslationAuthorName: item.lastConfirmedTranslationAuthorName || '',
            lastConfirmedBy: item.lastConfirmedBy || '',
            lastConfirmedByName: item.lastConfirmedByName || '',
            lastConfirmedAt: item.lastConfirmedAt || 0,
            originalEditedBy: item.originalEditedBy || '',
            originalEditedByName: item.originalEditedByName || '',
            originalEditedAt: item.originalEditedAt || 0
          };
        }

        const relocatedCount = itemsToRelocate.length;
        const numbers = parsed.map(item => item.number);
        const structure = allParsed.map(item => ({
          id: String(item.number),
          content: item.content,
          comment: item.comment || '',
          isEmpty: item.isEmpty === true
        }));
        const emptyIds = emptyParsed.map(item => String(item.number));

        const dupGroups = computeDuplicateGroups(structure);
        const dupGroupsArr = [];
        for (const [, ids] of dupGroups) dupGroupsArr.push({ ids });

        const rootUpdates = { metadata: {
          importedNumbers: numbers,
          lastImportStructure: structure,
          emptyStringIds: emptyIds,
          duplicateGroups: dupGroupsArr
        } };
        for (const [key, value] of Object.entries(updates)) rootUpdates[`strings/${key}`] = value;

        db.ref().update(rootUpdates)
          .then(() => {
            importedNumbers = numbers;
            lastImportStructure = structure;
            emptyStringIds = emptyIds;
            duplicateGroups = dupGroups;
            filterHideUnnecessary.checked = true;
            currentPage = 0;

            let msg = `Импортировано ${parsed.length} непустых строк`;
            if (emptyParsed.length > 0) msg += ` и ${emptyParsed.length} пустых (будут выведены при экспорте)`;
            msg += `. Включён фильтр "Скрыть ненужные фразы".`;
            if (relocatedCount > 0) msg += `\nПеренесено старых фраз (конфликт по ID): ${relocatedCount}.`;
            alert(msg);
            render();
          })
          .catch(err => {
            console.error('Ошибка импорта:', err);
            alert('Ошибка импорта: ' + err.message);
          });
      } catch (err) {
        alert('Ошибка при обработке файла: ' + err.message);
      }
    };
    reader.onerror = () => alert('Ошибка чтения файла');
    reader.readAsText(file, 'UTF-8');
  }

  importBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', function() {
    if (this.files && this.files[0]) importWTS(this.files[0]);
    this.value = '';
  });

  // ========== ИМПОРТ ПЕРЕВОДОВ ==========
  function importTranslationsFromWTS(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const text = e.target.result;
        const allParsed = parseWTS(text);
        const parsed = allParsed.filter(p => !p.isEmpty);

        if (parsed.length === 0) {
          alert('Не удалось найти ни одной непустой строки STRING в файле.');
          return;
        }

        const user = getCurrentUserInfo();
        const shouldConfirm = confirmImportedTranslations.checked;
        const structureById = new Map();
        for (const s of lastImportStructure) structureById.set(String(s.id), s);
        const dbByContent = new Map();
        for (const item of allData) {
          const c = normalizeOriginalForCompare(item.original);
          if (!dbByContent.has(c)) dbByContent.set(c, item.key);
        }
        const updates = {};
        let added = 0;
        let skippedUntranslated = 0;
        let skippedEmptyOriginals = 0;
        const notFound = [];
        for (const item of parsed) {
          const id = String(item.number);
          const transContent = stripLineBreaks(item.content);
          if (transContent === '') continue;
          let origContent = null;
          const struct = structureById.get(id);
          if (struct) {
            if (struct.isEmpty || stripLineBreaks(struct.content == null ? '' : String(struct.content)) === '') {
              skippedEmptyOriginals++;
              continue;
            }
            origContent = struct.content;
          } else {
            const byId = allData.find(d => d.key === id);
            if (byId) origContent = byId.original;
          }
          if (!origContent) { notFound.push(id); continue; }
          if (normalizeOriginalForCompare(transContent) === normalizeOriginalForCompare(origContent)) {
            skippedUntranslated++;
            continue;
          }
          const normOrig = normalizeOriginalForCompare(origContent);
          const dbKey = dbByContent.get(normOrig);
          if (!dbKey) { notFound.push(id); continue; }
          const updateData = {
            translation: transContent,
            translationAuthor: user.uid,
            translationAuthorName: user.displayName
          };
          updateData.confirmed = shouldConfirm;
          updateData.confirmedBy = shouldConfirm ? user.uid : '';
          updateData.confirmedByName = shouldConfirm ? user.displayName : '';
          if (shouldConfirm) {
            updateData.lastConfirmedTranslation = transContent;
            updateData.lastConfirmedTranslationAuthor = user.uid;
            updateData.lastConfirmedTranslationAuthorName = user.displayName;
            updateData.lastConfirmedBy = user.uid;
            updateData.lastConfirmedByName = user.displayName;
            updateData.lastConfirmedAt = Date.now();
          }
          updates[dbKey] = updateData;
          added++;
        }
        if (added === 0) {
          let msg = `Не найдено переводов для загрузки.\nПропущено непереведённых фраз: ${skippedUntranslated}.`;
          if (skippedEmptyOriginals > 0) msg += `\nПропущено (пустые оригиналы): ${skippedEmptyOriginals}.`;
          if (notFound.length > 0) msg += `\nНе найдено в базе по ID: ${notFound.length}.`;
          alert(msg);
          return;
        }
        const confirmMsg = shouldConfirm ? ' (будут помечены как ПОДТВЕРЖДЁННЫЕ)' : ' (без подтверждения)';
        if (!window.confirm(
          `Найдено переводов для загрузки: ${added}.\n` +
          `Пропущено непереведённых: ${skippedUntranslated}.\n` +
          (skippedEmptyOriginals > 0 ? `Пропущено (пустые оригиналы): ${skippedEmptyOriginals}.\n` : '') +
          `Не найдено в базе: ${notFound.length}.${confirmMsg}\n\nПродолжить?`
        )) return;
        const fieldUpdates = {};
        for (const [key, data] of Object.entries(updates)) {
          for (const [field, value] of Object.entries(data)) fieldUpdates[`${key}/${field}`] = value;
        }
        stringsRef.update(fieldUpdates)
          .then(() => {
            for (const item of allData) {
              if (updates[item.key]) Object.assign(item, updates[item.key]);
            }
            render();
            alert(
              `Обновлено переводов: ${added}.\n` +
              `Пропущено непереведённых: ${skippedUntranslated}.` +
              (skippedEmptyOriginals > 0 ? `\nПропущено (пустые оригиналы): ${skippedEmptyOriginals}.` : '') +
              (notFound.length > 0 ? `\nНе найдено: ${notFound.length}.` : '')
            );
          })
          .catch(err => alert('Ошибка при обновлении переводов: ' + err.message));
      } catch (err) {
        alert('Ошибка при обработке WTS-файла: ' + err.message);
      }
    };
    reader.onerror = () => alert('Ошибка чтения файла');
    reader.readAsText(file, 'UTF-8');
  }

  importTranslationsWtsBtn.addEventListener('click', () => translationsWtsInput.click());
  translationsWtsInput.addEventListener('change', function() {
    if (this.files && this.files[0]) importTranslationsFromWTS(this.files[0]);
    this.value = '';
  });

  // ========== ЭКСПОРТ WTS ==========
  function generateWTSFromStructure(data, structure, originalsOnly = false) {
    const index = originalsOnly ? null : buildContentIndex(data);
    let output = '';
    let count = 0;
    let emptyCount = 0;
    for (const s of structure) {
      const content = stripLineBreaks(s.content);
      const isEmpty = s.isEmpty === true || content === '';
      let text = content;
      if (isEmpty) {
        text = '';
        emptyCount++;
      } else if (!originalsOnly) {
        const key = index.get(normalizeOriginalForCompare(content));
        if (key === undefined) continue;
        const translation = stripLineBreaks(data[key].translation);
        if (translation !== '') text = translation;
      }
      const comment = cleanComment(s.comment);
      const header = `STRING ${cleanId(s.id)}${comment ? `\r\n// ${comment}` : ''}`;
      output += `${header}\r\n{\r\n${normalizeLineEndings(text)}\r\n}\r\n\r\n`;
      count++;
    }
    return { text: output, count, emptyCount };
  }

  function downloadFile(text, filename, type = 'text/plain;charset=utf-8') {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 0);
  }

  async function exportWTS(originalsOnly = false) {
    if (lastImportStructure.length === 0) {
      alert('Нет данных о последнем загруженном файле.\nСначала загрузите .wts с оригинальными фразами.');
      return;
    }
    try {
      const data = originalsOnly ? {} : (await stringsRef.once('value')).val();
      if (!originalsOnly && (!data || Object.keys(data).length === 0)) {
        alert('Нет данных для экспорта.');
        return;
      }
      const result = generateWTSFromStructure(data, lastImportStructure, originalsOnly);
      if (result.count === 0) {
        alert('Ни одна фраза из последнего загруженного файла не найдена в базе.');
        return;
      }
      downloadFile('\uFEFF' + result.text, originalsOnly ? 'original_strings.wts' : 'translated_strings.wts');
      alert(`Экспортировано ${result.count} фраз (из них пустых: ${result.emptyCount}).\nКодировка: UTF-8 с BOM. Переносы строк: CRLF.`);
    } catch (err) {
      alert('Ошибка экспорта: ' + err.message);
    }
  }

  exportBtn.addEventListener('click', () => exportWTS());
  exportOriginalsBtn.addEventListener('click', () => exportWTS(true));

  // ========== РЕЖИМ РЕДАКТИРОВАНИЯ ОРИГИНАЛА ==========
  editOriginalModeCheckbox.addEventListener('change', () => {
    if (!editOriginalModeCheckbox.checked) editingOriginalKey = null;
    render();
  });

  // ========== СКАЧИВАНИЕ БД ==========
  function downloadDatabase() {
    const user = getCurrentUserInfo();
    if (!user.canManageDb) { alert('У вас нет прав на скачивание базы данных.'); return; }
    Promise.all([stringsRef.once('value'), metadataRef.once('value')])
      .then(([stringsSnap, metadataSnap]) => {
        const stringsData = stringsSnap.val() || {};
        const metadataData = metadataSnap.val() || {};
        const backup = {
          _meta: {
            exportedAt: new Date().toISOString(),
            exportedBy: { uid: user.uid, displayName: user.displayName },
            version: 1,
            stringsCount: Object.keys(stringsData).length
          },
          strings: stringsData,
          metadata: metadataData
        };
        const json = JSON.stringify(backup, null, 2);
        const now = new Date();
        const ts = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}-${String(now.getMinutes()).padStart(2,'0')}-${String(now.getSeconds()).padStart(2,'0')}`;
        const filename = `kotmysh_db_backup_${ts}.json`;
        downloadFile(json, filename, 'application/json;charset=utf-8');
        alert(`База данных выгружена.\nФраз: ${Object.keys(stringsData).length}\nФайл: ${filename}`);
      })
      .catch(err => {
        console.error('Ошибка скачивания БД:', err);
        alert('Ошибка скачивания базы данных: ' + err.message);
      });
  }
  dbDownloadBtn.addEventListener('click', downloadDatabase);

  // ========== ВОССТАНОВЛЕНИЕ БД ==========
  function restoreDatabase(file) {
    const user = getCurrentUserInfo();
    if (!user.canManageDb) { alert('У вас нет прав на восстановление базы данных.'); return; }
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const text = e.target.result;
        let backup;
        try { backup = JSON.parse(text); }
        catch (parseErr) { alert('Файл не является корректным JSON.'); return; }
        if (!backup || typeof backup !== 'object') { alert('Неверный формат файла бэкапа.'); return; }
        const stringsData = backup.strings || {};
        const metadataData = backup.metadata || {};
        const stringsCount = Object.keys(stringsData).length;
        if (stringsCount === 0 && Object.keys(metadataData).length === 0) {
          alert('Файл не содержит данных для восстановления.');
          return;
        }
        const meta = backup._meta || {};
        const exportedInfo = meta.exportedAt ? `\nДата экспорта: ${new Date(meta.exportedAt).toLocaleString('ru-RU')}` : '';
        const authorInfo = meta.exportedBy && meta.exportedBy.displayName ? `\nЭкспортировал: ${meta.exportedBy.displayName}` : '';
        if (!confirm(
          `ВНИМАНИЕ! Восстановление базы данных ПОЛНОСТЬЮ ЗАМЕНИТ текущее содержимое.\n\n` +
          `В файле: ${stringsCount} фраз.${exportedInfo}${authorInfo}\n\n` +
          `Текущее содержимое будет безвозвратно удалено. Продолжить?`
        )) return;
        const code = prompt('Для подтверждения введите слово "ВОССТАНОВИТЬ" (без кавычек):');
        if (code !== 'ВОССТАНОВИТЬ') { alert('Операция отменена. Код не совпадает.'); return; }
        if (!confirm('Последний шанс! Заменить всю базу данных содержимым файла?')) return;
        db.ref().update({ strings: stringsData, metadata: metadataData })
          .then(() => {
            importedNumbers = Array.isArray(metadataData.importedNumbers) ? metadataData.importedNumbers : [];
            lastImportStructure = Array.isArray(metadataData.lastImportStructure) ? metadataData.lastImportStructure : [];
            emptyStringIds = Array.isArray(metadataData.emptyStringIds) ? metadataData.emptyStringIds : [];
            duplicateGroups = computeDuplicateGroups(lastImportStructure);
            currentPage = 0;
            alert(`База данных успешно восстановлена.\nВосстановлено фраз: ${stringsCount}`);
            render();
          })
          .catch(err => {
            console.error('Ошибка восстановления БД:', err);
            alert('Ошибка при восстановлении базы данных: ' + err.message);
          });
      } catch (err) {
        alert('Ошибка при обработке файла: ' + err.message);
      }
    };
    reader.onerror = () => alert('Ошибка чтения файла');
    reader.readAsText(file, 'UTF-8');
  }

  dbRestoreBtn.addEventListener('click', () => dbRestoreInput.click());
  dbRestoreInput.addEventListener('change', function() {
    if (this.files && this.files[0]) restoreDatabase(this.files[0]);
    this.value = '';
  });

  // ========== ПАГИНАЦИЯ ==========
  function goToPage(page) {
    const displayItems = getDisplayItems();
    const totalPages = itemsPerPage === 0 ? 1 : Math.ceil(displayItems.length / itemsPerPage);
    if (totalPages === 0) currentPage = 0;
    else {
      if (page < 0) page = 0;
      if (page >= totalPages) page = totalPages - 1;
      currentPage = page;
    }
    render();
  }

  prevPageBtn.addEventListener('click', () => goToPage(currentPage - 1));
  nextPageBtn.addEventListener('click', () => goToPage(currentPage + 1));

  perPageSelect.addEventListener('change', function() {
    itemsPerPage = parseInt(this.value, 10);
    currentPage = 0;
    render();
  });

  function handleGoto() {
    let page = parseInt(pageInput.value, 10);
    if (isNaN(page) || page < 1) page = 1;
    const displayItems = getDisplayItems();
    const totalPages = itemsPerPage === 0 ? 1 : Math.ceil(displayItems.length / itemsPerPage);
    if (totalPages === 0) page = 1;
    if (page > totalPages) page = totalPages;
    goToPage(page - 1);
  }

  gotoPageBtn.addEventListener('click', handleGoto);
  pageInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') handleGoto(); });

  searchInput.addEventListener('input', () => { currentPage = 0; render(); });

  for (const filter of [filterHideUnnecessary, filterNoTranslation,
    filterUnconfirmed, filterInactive, groupMode]) {
    filter.addEventListener('change', () => { currentPage = 0; render(); });
  }

  // ========== МЕТАДАННЫЕ ==========
  metadataRef.on('value', (snapshot) => {
    const data = snapshot.val();
    if (data && data.importedNumbers) {
      importedNumbers = data.importedNumbers;
      lastImportStructure = Array.isArray(data.lastImportStructure) ? data.lastImportStructure : [];
      emptyStringIds = Array.isArray(data.emptyStringIds) ? data.emptyStringIds : [];
      duplicateGroups = computeDuplicateGroups(lastImportStructure);
      if (filterHideUnnecessary.checked) render();
    }
  });

  metadataRef.once('value', (snapshot) => {
    const data = snapshot.val();
    if (data && data.importedNumbers) {
      importedNumbers = data.importedNumbers;
      lastImportStructure = Array.isArray(data.lastImportStructure) ? data.lastImportStructure : [];
      emptyStringIds = Array.isArray(data.emptyStringIds) ? data.emptyStringIds : [];
      duplicateGroups = computeDuplicateGroups(lastImportStructure);
      filterHideUnnecessary.checked = true;
      render();
    }
  });

  // ========== ДАННЫЕ ==========
  stringsRef.on('value', (snapshot) => {
    const data = snapshot.val();
    if (!data) { allData = []; render(); return; }
    const entries = Object.entries(data).sort((a, b) => parseInt(a[0]) - parseInt(b[0]));
    allData = entries.map(([key, entry]) => {
      let rawComment = entry.wtsComment || entry.comment || '';
      let rawComments = entry.userComments || [];
      return {
        key,
        original: stripLineBreaks(entry.original || ''),
        translation: stripLineBreaks(entry.translation || ''),
        translationAuthor: entry.translationAuthor || '',
        translationAuthorName: entry.translationAuthorName || '',
        wtsComment: (rawComment || '').trim(),
        userComments: Array.isArray(rawComments) ? rawComments : [],
        confirmed: entry.confirmed || false,
        confirmedBy: entry.confirmedBy || '',
        confirmedByName: entry.confirmedByName || '',
        inactive: entry.inactive || false,
        lastConfirmedTranslation: entry.lastConfirmedTranslation || '',
        lastConfirmedTranslationAuthor: entry.lastConfirmedTranslationAuthor || '',
        lastConfirmedTranslationAuthorName: entry.lastConfirmedTranslationAuthorName || '',
        lastConfirmedBy: entry.lastConfirmedBy || '',
        lastConfirmedByName: entry.lastConfirmedByName || '',
        lastConfirmedAt: entry.lastConfirmedAt || 0,
        originalEditedBy: entry.originalEditedBy || '',
        originalEditedByName: entry.originalEditedByName || '',
        originalEditedAt: entry.originalEditedAt || 0
      };
    });
    render();
  });

  // ========== ПОДКЛЮЧЕНИЕ ==========
  const connectedRef = firebase.database().ref('.info/connected');
  connectedRef.on('value', (snap) => {
    if (snap.val()) {
      connectionStatus.innerHTML = '✅ Подключено к Firebase';
      connectionStatus.style.color = '#2e7d32';
    } else {
      connectionStatus.innerHTML = '❌ Офлайн (изменения сохранятся позже)';
      connectionStatus.style.color = '#e53935';
    }
  });

  console.log('Приложение готово.');
</script>
