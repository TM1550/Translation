<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Совместный словарь переводов</title>
  <!-- Подключаем Firebase SDK (совместимая версия) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .app {
      max-width: 800px;
      width: 100%;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; color: #1a237e; margin-bottom: 20px; }
    .add-area {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .add-area input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #cfd8dc;
      border-radius: 8px;
      font-size: 16px;
      min-width: 120px;
    }
    .add-area input:focus {
      border-color: #0d47a1;
      outline: none;
    }
    .add-area button {
      padding: 10px 24px;
      background: #0d47a1;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .add-area button:hover { background: #1565c0; }
    .dictionary {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 500px;
      overflow-y: auto;
      margin-bottom: 16px;
    }
    .entry {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: #f8f9fa;
      border-radius: 8px;
      border-left: 4px solid #0d47a1;
    }
    .entry .phrase {
      font-weight: 600;
      width: 150px;
      flex-shrink: 0;
      word-break: break-word;
    }
    .entry .translation-input {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid #cfd8dc;
      border-radius: 6px;
      font-size: 15px;
    }
    .entry .translation-input:focus {
      border-color: #0d47a1;
      outline: none;
    }
    .entry .delete-btn {
      background: #e53935;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 14px;
    }
    .entry .delete-btn:hover { background: #c62828; }
    .status {
      font-size: 14px;
      color: #546e7a;
      text-align: center;
      border-top: 1px solid #ecf0f1;
      padding-top: 12px;
    }
    .status .online {
      color: #2e7d32;
      font-weight: 600;
    }
    .loader {
      text-align: center;
      padding: 20px;
      color: #888;
    }
  </style>
</head>
<body>
<div class="app">
  <h1>📚 Совместный перевод фраз</h1>
  <div class="add-area">
    <input type="text" id="newPhrase" placeholder="Фраза на оригинальном языке">
    <input type="text" id="newTranslation" placeholder="Перевод">
    <button id="addBtn">➕ Добавить</button>
    <button id="refreshBtn" style="background:#2e7d32;">🔄 Обновить</button>
  </div>
  <div id="dictionaryContainer" class="dictionary">
    <div class="loader">Загрузка словаря...</div>
  </div>
  <div class="status">
    <span id="connectionStatus">⏳ Подключение...</span>
    <span id="countStatus">Записей: 0</span>
  </div>
</div>

<script>
  // ============ ВСТАВЬТЕ СВОЮ КОНФИГУРАЦИЮ FIREBASE ============
  const firebaseConfig = {
    apiKey: "AIzaSyATbe93bnOiAQmdTUX1dh22UXwtA_dbMWI",
    authDomain: "translatorapp-6fd48.firebaseapp.com",
    databaseURL: "https://translatorapp-6fd48-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "translatorapp-6fd48",
    storageBucket: "translatorapp-6fd48.firebasestorage.app",
    messagingSenderId: "428558181807",
    appId: "1:428558181807:web:b891cd4d29c8b985eebb5a"
  };
  // =============================================================

  // Инициализация Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const phrasesRef = db.ref('phrases');

  // DOM-элементы
  const container = document.getElementById('dictionaryContainer');
  const newPhraseInput = document.getElementById('newPhrase');
  const newTranslationInput = document.getElementById('newTranslation');
  const addBtn = document.getElementById('addBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const connectionStatus = document.getElementById('connectionStatus');
  const countStatus = document.getElementById('countStatus');

  // Отслеживаем статус подключения
  const connectedRef = firebase.database().ref('.info/connected');
  connectedRef.on('value', (snap) => {
    if (snap.val() === true) {
      connectionStatus.innerHTML = '✅ Подключено к Firebase';
      connectionStatus.style.color = '#2e7d32';
    } else {
      connectionStatus.innerHTML = '❌ Офлайн (изменения сохранятся при восстановлении)';
      connectionStatus.style.color = '#e53935';
    }
  });

  // ========== СЛУШАЕМ ИЗМЕНЕНИЯ В БАЗЕ (РЕАЛЬНОЕ ВРЕМЯ) ==========
  phrasesRef.on('value', (snapshot) => {
    const data = snapshot.val();
    if (!data) {
      container.innerHTML = '<div class="loader">Словарь пуст. Добавьте первую фразу!</div>';
      countStatus.textContent = 'Записей: 0';
      return;
    }

    const entries = Object.entries(data);
    countStatus.textContent = `Записей: ${entries.length}`;

    // Строим список
    let html = '';
    for (const [phrase, translation] of entries) {
      const safePhrase = phrase.replace(/"/g, '&quot;');
      html += `
        <div class="entry" data-phrase="${safePhrase}">
          <span class="phrase">${escapeHtml(phrase)}</span>
          <input class="translation-input" type="text" value="${escapeHtml(translation)}" data-phrase="${safePhrase}">
          <button class="delete-btn" data-phrase="${safePhrase}">✕</button>
        </div>
      `;
    }
    container.innerHTML = html;

    // Назначаем обработчики на инпуты (сохранение при потере фокуса)
    container.querySelectorAll('.translation-input').forEach(input => {
      const phrase = input.dataset.phrase;
      input.addEventListener('change', function(e) {
        const newTranslation = e.target.value.trim();
        if (newTranslation === '') {
          alert('Перевод не может быть пустым');
          e.target.value = data[phrase] || '';
          return;
        }
        // Сохраняем в Firebase
        phrasesRef.child(phrase).set(newTranslation)
          .catch(err => alert('Ошибка сохранения: ' + err.message));
      });
    });

    // Назначаем обработчики на кнопки удаления
    container.querySelectorAll('.delete-btn').forEach(btn => {
      const phrase = btn.dataset.phrase;
      btn.addEventListener('click', function() {
        if (confirm(`Удалить фразу "${phrase}"?`)) {
          phrasesRef.child(phrase).remove()
            .catch(err => alert('Ошибка удаления: ' + err.message));
        }
      });
    });
  });

  // ========== ДОБАВЛЕНИЕ НОВОЙ ФРАЗЫ ==========
  function addPhrase() {
    const phrase = newPhraseInput.value.trim();
    const translation = newTranslationInput.value.trim();
    if (!phrase || !translation) {
      alert('Заполните оба поля');
      return;
    }

    // Проверяем, существует ли уже такая фраза
    phrasesRef.child(phrase).once('value', (snap) => {
      if (snap.exists()) {
        alert('Такая фраза уже есть. Отредактируйте её перевод в списке.');
        return;
      }
      phrasesRef.child(phrase).set(translation)
        .then(() => {
          newPhraseInput.value = '';
          newTranslationInput.value = '';
        })
        .catch(err => alert('Ошибка добавления: ' + err.message));
    });
  }

  addBtn.addEventListener('click', addPhrase);

  // Добавление по Enter в полях
  newPhraseInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') addPhrase(); });
  newTranslationInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') addPhrase(); });

  // Кнопка "Обновить" принудительно перезагружает данные (но они и так обновляются автоматически)
  refreshBtn.addEventListener('click', () => {
    // Просто дергаем чтение, чтобы обновить статус
    phrasesRef.once('value', (snap) => {
      const count = snap.val() ? Object.keys(snap.val()).length : 0;
      countStatus.textContent = `Записей: ${count} (обновлено)`;
    });
  });

  // ========== ВСПОМОГАТЕЛЬНАЯ ФУНКЦИЯ ==========
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
</script>
</body>
</html>
