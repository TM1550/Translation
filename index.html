<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Перевод карты Котомышь</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 16px;
    }
    .app {
      width: 100%;
      max-width: 1400px;
      background: white;
      padding: 20px 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 32px);
      max-height: calc(100vh - 32px);
      overflow: hidden;
    }
    h1 { text-align: center; color: #1a237e; margin: 0 0 12px 0; font-size: 1.8rem; flex-shrink: 0; }
    .auth-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      padding: 8px 14px;
      background: #e8eaf6;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .auth-bar button {
      padding: 6px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      background: #1a237e;
      color: white;
    }
    .auth-bar button:hover { background: #0d47a1; }
    .auth-bar .user-info { font-weight: 500; margin-right: auto; }
    .auth-bar .role-badge {
      background: #ffca28;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      color: #333;
    }
    .auth-bar .admin-badge {
      background: #d32f2f;
      color: white;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
    }
    .auth-bar .set-name-btn { background: #2e7d32; }
    .auth-bar .set-name-btn:hover { background: #1b5e20; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
      align-items: center;
      flex-shrink: 0;
    }
    .toolbar button {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      background: #0d47a1;
      color: white;
      transition: 0.2s;
      font-weight: 500;
    }
    .toolbar button:hover { background: #1565c0; }
    .toolbar .export-btn { background: #2e7d32; }
    .toolbar .export-btn:hover { background: #388e3c; }
    .toolbar .import-btn { background: #e65100; }
    .toolbar .import-btn:hover { background: #bf360c; }
    .toolbar .import-translations-wts-btn { background: #4a148c; }
    .toolbar .import-translations-wts-btn:hover { background: #6a1b9a; }
    .toolbar .db-download-btn { background: #00695c; }
    .toolbar .db-download-btn:hover { background: #004d40; }
    .toolbar .db-restore-btn { background: #b71c1c; }
    .toolbar .db-restore-btn:hover { background: #7f0000; }
    #fileInput, #translationsWtsInput, #dbRestoreInput { display: none; }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #f5f5f5;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 14px;
      flex-wrap: wrap;
    }
    .filter-group label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .filter-group input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
    .search-group { display: flex; align-items: center; gap: 6px; }
    .search-group input[type="text"] {
      padding: 4px 10px;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 14px;
      width: 200px;
      max-width: 100%;
    }
    .search-group input[type="text"]:focus { border-color: #0d47a1; outline: none; }
    .pagination {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-left: auto;
    }
    .pagination select { padding: 4px 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
    .pagination span { font-size: 14px; color: #333; }
    .pagination button {
      padding: 4px 12px;
      background: #e0e0e0;
      color: #333;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
    .pagination button:hover:not(:disabled) { background: #bdbdbd; }
    .pagination input[type="number"] {
      width: 60px;
      padding: 4px 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
      text-align: center;
    }
    .pagination .goto-btn { background: #0d47a1; color: white; padding: 4px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .pagination .goto-btn:hover { background: #1565c0; }
    .stats { font-size: 14px; color: #555; font-weight: 500; white-space: nowrap; }
    .dictionary {
      flex: 1 1 auto;
      overflow-y: auto;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 4px 0;
      min-height: 200px;
      margin-bottom: 8px;
    }
    .entry {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 12px 14px;
      background: #f8f9fa;
      border-radius: 8px;
      border-left: 4px solid #0d47a1;
      margin: 4px 8px;
      align-items: start;
      transition: background 0.2s;
    }
    .entry.inactive { background: #f0f0f0; opacity: 0.7; }
    .entry.inactive .original { text-decoration: line-through; color: #999; }
    .entry.group-header { border-left-color: #e65100; background: #fff8e1; }
    .entry.group-header.inactive { background: #f0e8d0; }
    .entry .left-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 100%;
      word-break: break-word;
    }
    .entry .right-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-left: 1px solid #ddd;
      padding-left: 16px;
      max-width: 100%;
    }
    .entry .meta { font-size: 13px; color: #888; }
    .entry .original { font-weight: 500; white-space: pre-wrap; word-break: break-word; max-width: 100%; }
    .entry .translation-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 8px;
      width: 100%;
    }
    .entry .translation-input {
      flex: 1 1 200px;
      padding: 6px 10px;
      border: 1px solid #cfd8dc;
      border-radius: 6px;
      font-size: 15px;
      font-family: inherit;
      line-height: 1.4;
      width: 100%;
      resize: none;
      overflow: hidden;
      min-height: 38px;
    }
    .entry .translation-input:focus { border-color: #0d47a1; outline: none; }
    .entry .save-translation-btn {
      background: #0d47a1;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 13px;
      align-self: flex-start;
    }
    .entry .save-translation-btn:hover { background: #1565c0; }
    .entry .group-info {
      font-size: 13px;
      color: #e65100;
      background: #fff3e0;
      padding: 2px 10px;
      border-radius: 12px;
      display: inline-block;
      margin-top: 4px;
    }
    .entry .author-info {
      font-size: 12px;
      color: #666;
      margin: 2px 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .entry .confirmed-badge {
      font-size: 13px;
      color: #2e7d32;
      background: #e8f5e9;
      padding: 2px 10px;
      border-radius: 12px;
      margin-left: 8px;
    }
    .entry .confirm-btn {
      background: #1565c0;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    .entry .confirm-btn:hover:not(:disabled) { background: #0d47a1; }
    .entry .confirm-btn:disabled { background: #b0bec5; cursor: not-allowed; opacity: 0.7; }
    .entry .confirm-btn.confirmed { background: #e53935; }
    .entry .confirm-btn.confirmed:hover:not(:disabled) { background: #c62828; }
    .entry .confirm-btn.confirmed:disabled { background: #b0bec5; cursor: not-allowed; }
    .entry .inactive-btn { background: #795548; color: white; border: none; border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
    .entry .inactive-btn:hover { background: #5d4037; }
    .entry .inactive-btn.active { background: #4caf50; }
    .entry .inactive-btn.active:hover { background: #388e3c; }
    .entry .similar-btn { background: #6a1b9a; color: white; border: none; border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
    .entry .similar-btn:hover { background: #4a148c; }
    .entry .comment-section {
      grid-column: 1 / -1;
      margin-top: 6px;
      padding-top: 8px;
      border-top: 1px dashed #ccc;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .entry .comment-section .wts-comment {
      font-size: 13px;
      color: #5d4037;
      background: #fff3e0;
      padding: 2px 8px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 4px;
    }
    .entry .comment-section .user-comment {
      font-size: 14px;
      background: #e3f2fd;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 2px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .entry .comment-section .user-comment .comment-text { flex: 1; white-space: pre-wrap; word-break: break-word; }
    .entry .comment-section .user-comment .comment-author { font-size: 12px; color: #666; margin-left: 8px; white-space: nowrap; }
    .entry .comment-section .comment-input { width: 100%; padding: 6px 10px; border: 1px solid #cfd8dc; border-radius: 6px; font-size: 14px; margin-top: 4px; }
    .entry .comment-section .comment-save-btn { background: #0d47a1; color: white; border: none; border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 13px; margin-top: 4px; align-self: flex-start; }
    .entry .comment-section .comment-save-btn:hover { background: #1565c0; }
    .entry .comment-section .show-all-btn { background: #4a148c; color: white; border: none; border-radius: 6px; padding: 2px 10px; cursor: pointer; font-size: 12px; margin-top: 4px; align-self: flex-start; }
    .entry .comment-section .show-all-btn:hover { background: #6a1b9a; }
    .loader { text-align: center; padding: 20px; color: #888; }
    .status {
      flex-shrink: 0;
      margin-top: 8px;
      font-size: 14px;
      color: #546e7a;
      border-top: 1px solid #ecf0f1;
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
    }
    .status .online { color: #2e7d32; font-weight: 600; }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: white;
      max-width: 700px;
      width: 90%;
      max-height: 80vh;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      overflow-y: auto;
      position: relative;
    }
    .modal-box .close-btn { position: absolute; top: 10px; right: 16px; font-size: 28px; cursor: pointer; color: #888; }
    .modal-box .close-btn:hover { color: #333; }
    .modal-box h3 { margin-bottom: 12px; }
    .modal-box .modal-item { margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #eee; }
    .modal-box .modal-item .modal-original { font-weight: 500; }
    .modal-box .modal-item .modal-translation { color: #555; font-size: 0.95em; margin-top: 4px; }
    .modal-box .modal-item .modal-score { font-size: 0.8em; color: #888; margin-top: 2px; }
    .modal-box .modal-item strong { background: #ffeb3b; padding: 0 2px; border-radius: 2px; }
    .modal-box .modal-item .modal-header { display: flex; justify-content: space-between; }
    .modal-box .modal-item .modal-header .modal-key { color: #888; font-size: 0.9em; }
    @media (max-width: 768px) {
      .entry { grid-template-columns: 1fr; }
      .entry .right-col { border-left: none; padding-left: 0; border-top: 1px solid #ddd; padding-top: 8px; }
      .app { padding: 12px; height: calc(100vh - 24px); }
      .toolbar { gap: 8px; }
      .filter-group { flex-wrap: wrap; gap: 8px; padding: 4px 8px; }
    }
  </style>
</head>
<body>
<div class="app">
  <h1>Перевод карты Котомышь</h1>

  <div class="auth-bar" id="authBar">
    <span class="user-info" id="userInfo">Не авторизован</span>
    <span class="role-badge" id="roleBadge" style="display:none;"></span>
    <span class="admin-badge" id="adminBadge" style="display:none;">️ Админ БД</span>
    <button id="loginGoogleBtn">Войти через Google</button>
    <button id="setNameBtn" class="set-name-btn" style="display:none;">Задать имя</button>
    <button id="logoutBtn">Выйти</button>
  </div>

  <div class="toolbar">
    <button id="refreshBtn">🔄 Обновить</button>
    <button class="import-btn" id="importBtn" style="display:none;"> Загрузить .wts</button>
    <input type="file" id="fileInput" accept=".wts">
    <button class="import-translations-wts-btn" id="importTranslationsWtsBtn" style="display:none;">📥 Загрузить переводы .wts</button>
    <input type="file" id="translationsWtsInput" accept=".wts" style="display:none;">
    <label style="display:inline-flex;align-items:center;gap:4px;font-size:14px;background:#e0f2f1;padding:4px 12px;border-radius:20px;cursor:pointer;" title="Если отмечено — загруженные переводы будут помечены как подтверждённые">
      <input type="checkbox" id="confirmImportedTranslations"> Подтвердить импорт
    </label>
    <button class="export-btn" id="exportBtn" style="display:none;"> Скачать .wts</button>

    <button class="db-download-btn" id="dbDownloadBtn" style="display:none;">💾 Скачать БД</button>
    <button class="db-restore-btn" id="dbRestoreBtn" style="display:none;"> Восстановить БД</button>
    <input type="file" id="dbRestoreInput" accept=".json" style="display:none;">

    <div class="filter-group">
      <label><input type="checkbox" id="filterOnlyRussian"> Только с русскими буквами</label>
      <label><input type="checkbox" id="filterNoTranslation"> Без перевода</label>
      <label><input type="checkbox" id="filterHideEditorSuffix"> Скрыть с EditorSuffix</label>
      <label><input type="checkbox" id="filterUnconfirmed"> Неподтверждённые переводы</label>
      <label><input type="checkbox" id="filterByImported"> Только загруженные</label>
      <label><input type="checkbox" id="filterInactive"> Скрыть неактивные</label>
      <label><input type="checkbox" id="groupMode"> Группировать по шаблону</label>
    </div>

    <div class="search-group">
      <input type="text" id="searchInput" placeholder=" Поиск по фразе, переводу или комментарию">
    </div>

    <div class="pagination">
      <button id="prevPage" disabled>◀</button>
      <span id="pageInfo">1 / 1</span>
      <button id="nextPage" disabled>▶</button>
      <input type="number" id="pageInput" min="1" value="1">
      <button class="goto-btn" id="gotoPage">Перейти</button>
      <select id="perPage">
        <option value="10">10</option>
        <option value="25" selected>25</option>
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="0">Все</option>
      </select>
    </div>
    <span class="stats" id="stats">Записей: 0</span>
  </div>

  <div id="dictionaryContainer" class="dictionary">
    <div class="loader">Загрузка словаря...</div>
  </div>

  <div class="modal-overlay" id="commentsModal">
    <div class="modal-box">
      <span class="close-btn" id="modalCloseBtn">&times;</span>
      <h3 id="modalTitle">Комментарии к фразе #<span id="modalKey"></span></h3>
      <div id="modalCommentsList"></div>
    </div>
  </div>

  <div class="modal-overlay" id="similarModal">
    <div class="modal-box">
      <span class="close-btn" id="similarModalClose">&times;</span>
      <h3 id="similarModalTitle">Похожие подтверждённые переводы</h3>
      <div id="similarModalList"></div>
    </div>
  </div>

  <div class="status">
    <span id="connectionStatus">⏳ Подключение...</span>
    <span id="countStatus">0</span>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyATbe93bnOiAQmdTUX1dh22UXwtA_dbMWI",
    authDomain: "translatorapp-6fd48.firebaseapp.com",
    databaseURL: "https://translatorapp-6fd48-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "translatorapp-6fd48",
    storageBucket: "translatorapp-6fd48.firebasestorage.app",
    messagingSenderId: "428558181807",
    appId: "1:428558181807:web:b891cd4d29c8b985eebb5a"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const auth = firebase.auth();
  const stringsRef = db.ref('strings');
  const metadataRef = db.ref('metadata');
  const usersRef = db.ref('users');

  const container = document.getElementById('dictionaryContainer');
  const statsSpan = document.getElementById('stats');
  const countStatus = document.getElementById('countStatus');
  const connectionStatus = document.getElementById('connectionStatus');
  const fileInput = document.getElementById('fileInput');
  const importBtn = document.getElementById('importBtn');
  const importTranslationsWtsBtn = document.getElementById('importTranslationsWtsBtn');
  const translationsWtsInput = document.getElementById('translationsWtsInput');
  const confirmImportedTranslations = document.getElementById('confirmImportedTranslations');
  const exportBtn = document.getElementById('exportBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const filterOnlyRussian = document.getElementById('filterOnlyRussian');
  const filterNoTranslation = document.getElementById('filterNoTranslation');
  const filterHideEditorSuffix = document.getElementById('filterHideEditorSuffix');
  const filterUnconfirmed = document.getElementById('filterUnconfirmed');
  const filterByImported = document.getElementById('filterByImported');
  const filterInactive = document.getElementById('filterInactive');
  const groupMode = document.getElementById('groupMode');
  const perPageSelect = document.getElementById('perPage');
  const prevPageBtn = document.getElementById('prevPage');
  const nextPageBtn = document.getElementById('nextPage');
  const pageInfo = document.getElementById('pageInfo');
  const pageInput = document.getElementById('pageInput');
  const gotoPageBtn = document.getElementById('gotoPage');
  const searchInput = document.getElementById('searchInput');
  const dbDownloadBtn = document.getElementById('dbDownloadBtn');
  const dbRestoreBtn = document.getElementById('dbRestoreBtn');
  const dbRestoreInput = document.getElementById('dbRestoreInput');

  const userInfo = document.getElementById('userInfo');
  const roleBadge = document.getElementById('roleBadge');
  const adminBadge = document.getElementById('adminBadge');
  const loginGoogleBtn = document.getElementById('loginGoogleBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const setNameBtn = document.getElementById('setNameBtn');

  const commentsModal = document.getElementById('commentsModal');
  const modalCloseBtn = document.getElementById('modalCloseBtn');
  const modalTitle = document.getElementById('modalTitle');
  const modalCommentsList = document.getElementById('modalCommentsList');
  const modalKeySpan = document.getElementById('modalKey');

  const similarModal = document.getElementById('similarModal');
  const similarModalClose = document.getElementById('similarModalClose');
  const similarModalTitle = document.getElementById('similarModalTitle');
  const similarModalList = document.getElementById('similarModalList');

  let allData = [];
  let currentPage = 0;
  let itemsPerPage = 25;
  let currentUser = null;
  let currentDisplayName = '';
  let currentUserRole = 'translator';
  let currentUserCanManageDb = false;
  let importedNumbers = [];
  let lastImportStructure = [];

  // ========== АВТОРИЗАЦИЯ ==========

  function isAuthSupported() {
    try {
      localStorage.setItem('test', 'test');
      localStorage.removeItem('test');
      return window.location.protocol === 'http:' ||
             window.location.protocol === 'https:' ||
             window.location.protocol === 'chrome-extension:';
    } catch (e) {
      return false;
    }
  }

  function updateAuthUI(user) {
    if (user) {
      currentUser = user;
      const uid = user.uid;
      usersRef.child(uid).once('value')
        .then((snap) => {
          const data = snap.val() || {};
          let name = data.displayName;
          let role = data.role || 'translator';
          let canManageDb = data.canManageDb === true;
          if (!name) {
            name = user.displayName || 'Аноним';
            usersRef.child(uid).update({ displayName: name }).catch(err => console.warn(err));
          }
          applyUserData(name, role, canManageDb);
        })
        .catch(() => {
          const name = user.displayName || 'Аноним';
          applyUserData(name, 'translator', false);
        });
    } else {
      currentUser = null;
      currentDisplayName = '';
      currentUserRole = 'translator';
      currentUserCanManageDb = false;
      userInfo.textContent = 'Не авторизован';
      roleBadge.style.display = 'none';
      adminBadge.style.display = 'none';
      setNameBtn.style.display = 'none';
      loginGoogleBtn.style.display = 'inline-block';
      logoutBtn.style.display = 'none';
      importBtn.style.display = 'none';
      importTranslationsWtsBtn.style.display = 'none';
      exportBtn.style.display = 'none';
      confirmImportedTranslations.closest('label').style.display = 'none';
      dbDownloadBtn.style.display = 'none';
      dbRestoreBtn.style.display = 'none';
      render();
    }
  }

  function applyUserData(name, role, canManageDb) {
    currentDisplayName = name;
    currentUserRole = role;
    currentUserCanManageDb = canManageDb === true;
    userInfo.textContent = `👤 ${name} (${currentUser.email || 'аноним'})`;
    roleBadge.textContent = role === 'editor' ? 'Редактор' : 'Переводчик';
    roleBadge.style.display = 'inline-block';
    setNameBtn.style.display = 'inline-block';
    loginGoogleBtn.style.display = 'none';
    logoutBtn.style.display = 'inline-block';

    if (role === 'editor') {
      importBtn.style.display = 'inline-block';
      importTranslationsWtsBtn.style.display = 'inline-block';
      exportBtn.style.display = 'inline-block';
      confirmImportedTranslations.closest('label').style.display = 'inline-flex';
    } else {
      importBtn.style.display = 'none';
      importTranslationsWtsBtn.style.display = 'none';
      exportBtn.style.display = 'none';
      confirmImportedTranslations.closest('label').style.display = 'none';
    }

    if (currentUserCanManageDb) {
      adminBadge.style.display = 'inline-block';
      dbDownloadBtn.style.display = 'inline-block';
      dbRestoreBtn.style.display = 'inline-block';
    } else {
      adminBadge.style.display = 'none';
      dbDownloadBtn.style.display = 'none';
      dbRestoreBtn.style.display = 'none';
    }

    render();
  }

  loginGoogleBtn.addEventListener('click', () => {
    if (!isAuthSupported()) {
      alert('Авторизация не поддерживается в текущем окружении.');
      return;
    }
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(err => alert('Ошибка входа: ' + err.message));
  });

  logoutBtn.addEventListener('click', () => { auth.signOut(); });

  setNameBtn.addEventListener('click', () => {
    if (!currentUser) return;
    const newName = prompt('Введите ваше отображаемое имя:', currentDisplayName);
    if (newName && newName.trim() !== '') {
      const name = newName.trim();
      usersRef.child(currentUser.uid).update({ displayName: name })
        .then(() => {
          currentDisplayName = name;
          userInfo.textContent = `👤 ${name} (${currentUser.email || 'аноним'})`;
        })
        .catch(err => alert('Ошибка сохранения имени: ' + err.message));
    }
  });

  auth.onAuthStateChanged(user => { updateAuthUI(user); });

  // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========

  function getCurrentUserInfo() {
    if (currentUser) {
      return { uid: currentUser.uid, displayName: currentDisplayName, role: currentUserRole, canManageDb: currentUserCanManageDb };
    }
    return { uid: null, displayName: 'Аноним', role: 'translator', canManageDb: false };
  }

  function hasRussian(text) { return /[а-яё]/i.test(text); }
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function formatTimestamp(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function extractNumbers(str) {
    const matches = str.match(/\d+/g);
    return matches ? matches.map(Number) : [];
  }

  function normalizeText(str) {
    return str.replace(/\s+/g, ' ').trim();
  }

  function normalizeOriginalForCompare(text) {
    return cleanWtsText(text).toLowerCase();
  }

  function normalizeForMatch(text) {
    return cleanWtsText(text || '').toLowerCase();
  }

  function cleanWtsText(text) {
    if (!text) return '';
    let cleaned = text.replace(/\|c[0-9a-fA-F]{6,8}/g, '');
    cleaned = cleaned.replace(/\|r/g, '');
    cleaned = cleaned.replace(/\s+/g, ' ').trim();
    return cleaned;
  }

  // ========== НОВАЯ ЛОГИКА ГРУППИРОВКИ ==========
  
  function makePattern(str) {
    if (!str) return '__empty__';
    // Извлекаем все непрерывные последовательности русских букв
    const cyrillicWords = str.match(/[а-яё]+/gi);
    if (!cyrillicWords || cyrillicWords.length === 0) {
      return '__no_cyrillic__';
    }
    // Собираем их в одну строку через пробел и приводим к нижнему регистру
    return cyrillicWords.join(' ').toLowerCase();
  }

  function escapeRegExp(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function substituteIdentifiers(translation, sourceOriginal, targetOriginal) {
    const blockRe = /<[^>]*>/g;
    const srcBlocks = sourceOriginal.match(blockRe) || [];
    const tgtBlocks = targetOriginal.match(blockRe) || [];

    if (srcBlocks.length === 0 || srcBlocks.length !== tgtBlocks.length) {
      return translation;
    }

    const substitutions = new Map();

    for (let i = 0; i < srcBlocks.length; i++) {
      const s = srcBlocks[i];
      const t = tgtBlocks[i];
      if (s === t) continue;

      const sParts = s.slice(1, -1).split(',');
      const tParts = t.slice(1, -1).split(',');
      if (sParts.length !== tParts.length) continue;

      for (let j = 0; j < sParts.length; j++) {
        const a = sParts[j].trim();
        const b = tParts[j].trim();
        if (a === b) continue;
        if (/^[A-Za-z0-9_]+$/.test(a) && /^[A-Za-z0-9_]+$/.test(b)) {
          substitutions.set(a, b);
        }
      }
    }

    if (substitutions.size === 0) return translation;

    let result = translation;
    for (const [from, to] of substitutions) {
      const re = new RegExp('\\b' + escapeRegExp(from) + '\\b', 'g');
      result = result.replace(re, to);
    }
    return result;
  }

  // НОВАЯ ФУНКЦИЯ АВТОПОДСТАНОВКИ
function applyTranslationToMember(templateTranslation, sourceOriginal, targetOriginal) {
    if (!templateTranslation || templateTranslation.trim() === '') {
        return '';
    }
    
    // Извлекаем все слова (и кириллицу, и латиницу) из перевода пользователя
    const transWords = templateTranslation.match(/[а-яёa-z]+/gi) || [];
    
    // Создаем результат на основе целевого оригинала
    let result = targetOriginal;
    let wordIndex = 0;
    
    // Заменяем ВСЕ слова (кириллические) в целевом оригинале на слова из перевода
    result = result.replace(/[а-яё]+/gi, (match) => {
        if (wordIndex < transWords.length) {
            return transWords[wordIndex++];
        }
        return match;
    });
    
    // Если слов в переводе больше, добавляем остаток в конец
    if (wordIndex < transWords.length) {
        result += ' ' + transWords.slice(wordIndex).join(' ');
    }
    
    return result;
}

  function buildContentIndex(data) {
    const index = new Map();
    for (const [key, entry] of Object.entries(data)) {
      const c = normalizeForMatch(entry.original);
      if (!index.has(c)) index.set(c, key);
    }
    return index;
  }

  function buildGroups(dataArray) {
    const map = new Map();
    for (const item of dataArray) {
      const pattern = makePattern(item.original);
      if (!map.has(pattern)) map.set(pattern, []);
      map.get(pattern).push(item);
    }
    const groups = [];
    for (const [pattern, members] of map) {
      members.sort((a, b) => parseInt(a.key) - parseInt(b.key));
      groups.push({ pattern, members });
    }
    groups.sort((a, b) => parseInt(a.members[0].key) - parseInt(b.members[0].key));
    return groups;
  }

  function getFilteredData() {
    let filtered = allData;

    if (filterByImported.checked && importedNumbers.length > 0) {
      filtered = filtered.filter(item => importedNumbers.includes(item.key));
    }

    if (filterInactive.checked) {
      filtered = filtered.filter(item => !item.inactive);
    }

    const searchTerm = searchInput.value.trim().toLowerCase();
    if (searchTerm !== '') {
      filtered = filtered.filter(item => {
        const orig = (item.original || '').toLowerCase();
        const trans = (item.translation || '').toLowerCase();
        const wtsComment = (item.wtsComment || '').toLowerCase();
        return orig.includes(searchTerm) || trans.includes(searchTerm) || wtsComment.includes(searchTerm);
      });
    }

    if (filterOnlyRussian.checked) {
      filtered = filtered.filter(item => hasRussian(item.original));
    }
    if (filterNoTranslation.checked) {
      filtered = filtered.filter(item => item.translation.trim() === '');
    }
    if (filterHideEditorSuffix.checked) {
      filtered = filtered.filter(item => {
        const comment = item.wtsComment || '';
        return !comment.toLowerCase().includes('editorsuffix');
      });
    }
    if (filterUnconfirmed.checked) {
      filtered = filtered.filter(item => {
        const hasTranslation = item.translation.trim() !== '';
        return hasTranslation && !item.confirmed;
      });
    }
    return filtered;
  }

  function getDisplayItems() {
    const filtered = getFilteredData();
    if (!groupMode.checked) {
      return filtered;
    } else {
      const groups = buildGroups(filtered);
      return groups.map(group => {
        const rep = { ...group.members[0] };
        rep._groupMembers = group.members;
        return rep;
      });
    }
  }

  function getPaginatedData(items) {
    if (itemsPerPage === 0) return items;
    const start = currentPage * itemsPerPage;
    return items.slice(start, start + itemsPerPage);
  }

  function autoResize(textarea) {
    textarea.style.height = 'auto';
    textarea.style.height = textarea.scrollHeight + 'px';
  }

  function saveTranslation(key, newTranslation) {
    const item = allData.find(d => d.key === key);
    if (!item) return;
    const user = getCurrentUserInfo();

    const isTranslationEmpty = newTranslation.trim() === '';

    function prepareUpdate(translation, authorUid, authorName) {
      const update = {
        translation: translation,
        translationAuthor: authorUid,
        translationAuthorName: authorName,
        confirmed: false,
        confirmedBy: '',
        confirmedByName: ''
      };
      if (translation.trim() === '') {
        update.translationAuthor = '';
        update.translationAuthorName = '';
      }
      return update;
    }

    if (groupMode.checked) {
      const pattern = makePattern(item.original);
      const members = allData.filter(m => makePattern(m.original) === pattern);
      if (members.length > 1) {
        const updates = {};
        for (const member of members) {
          let memberTranslation;
          if (member.key === key) {
            memberTranslation = newTranslation;
          } else {
            memberTranslation = applyTranslationToMember(newTranslation, item.original, member.original);
          }
          const localItem = allData.find(d => d.key === member.key);
          if (localItem) {
            localItem.translation = memberTranslation;
            localItem.translationAuthor = isTranslationEmpty ? '' : user.uid;
            localItem.translationAuthorName = isTranslationEmpty ? '' : user.displayName;
            localItem.confirmed = false;
            localItem.confirmedBy = '';
            localItem.confirmedByName = '';
          }
          updates[member.key] = prepareUpdate(memberTranslation, isTranslationEmpty ? '' : user.uid, isTranslationEmpty ? '' : user.displayName);
        }
        for (const [k, val] of Object.entries(updates)) {
          stringsRef.child(k).update(val).catch(err => alert('Ошибка сохранения для #' + k + ': ' + err.message));
        }
        render();
        return;
      }
    }

    const updateData = prepareUpdate(newTranslation, isTranslationEmpty ? '' : user.uid, isTranslationEmpty ? '' : user.displayName);
    stringsRef.child(key).update(updateData).catch(err => alert('Ошибка сохранения: ' + err.message));
  }

  function toggleInactive(key) {
    const item = allData.find(d => d.key === key);
    if (!item) return;

    const newState = !item.inactive;
    const targetPattern = makePattern(item.original);

    const matchingKeys = allData
      .filter(d => makePattern(d.original) === targetPattern)
      .map(d => d.key);

    if (matchingKeys.length === 0) return;

    for (const k of matchingKeys) {
      const local = allData.find(d => d.key === k);
      if (local) local.inactive = newState;
    }

    const updates = {};
    for (const k of matchingKeys) {
      updates[k + '/inactive'] = newState;
    }

    stringsRef.update(updates)
      .then(() => { render(); })
      .catch(err => alert('Ошибка обновления статуса: ' + err.message));
  }

  function findSimilarConfirmedTranslations(original, excludeKey, maxResults = 5) {
    const words = text => text.toLowerCase().replace(/[^a-zа-яё\s]/g, '').split(/\s+/).filter(w => w.length > 2);
    const currentWords = words(original);
    if (currentWords.length === 0) return [];
    const results = [];

    const currentNormalized = normalizeOriginalForCompare(original);

    for (const entry of allData) {
      if (entry.key === excludeKey) continue;
      if (!entry.confirmed) continue;
      if (!entry.translation || entry.translation.trim() === '') continue;
      if (normalizeOriginalForCompare(entry.original) === currentNormalized) continue;

      const entryWords = words(entry.original);
      const common = currentWords.filter(w => entryWords.includes(w));
      if (common.length === 0) continue;
      const union = new Set([...currentWords, ...entryWords]);
      const score = common.length / union.size;
      results.push({
        key: entry.key,
        original: entry.original,
        translation: entry.translation,
        commonWords: common,
        score: score
      });
    }
    results.sort((a, b) => b.score - a.score);
    return results.slice(0, maxResults);
  }

  function showSimilarTranslations(key) {
    const item = allData.find(d => d.key === key);
    if (!item) return;
    const similar = findSimilarConfirmedTranslations(item.original, key);
    if (similar.length === 0) {
      alert('Нет похожих подтверждённых переводов.');
      return;
    }
    similarModalTitle.textContent = `Похожие подтверждённые переводы для #${key}`;
    let html = '';
    for (const s of similar) {
      const words = s.original.split(/\s+/);
      const highlighted = words.map(w => {
        const clean = w.replace(/[^a-zа-яё0-9]/gi, '');
        if (s.commonWords.includes(clean.toLowerCase())) {
          return `<strong>${escapeHtml(w)}</strong>`;
        }
        return escapeHtml(w);
      }).join(' ');
      html += `
        <div class="modal-item">
          <div class="modal-header">
            <span class="modal-key">#${s.key}</span>
            <span class="modal-score">Сходство: ${(s.score * 100).toFixed(0)}%</span>
          </div>
          <div class="modal-original">${highlighted}</div>
          <div class="modal-translation">Перевод: ${escapeHtml(s.translation)}</div>
        </div>
      `;
    }
    similarModalList.innerHTML = html;
    similarModal.classList.add('active');
  }

  // ========== РЕНДЕРИНГ ==========
  function render() {
    try {
      const displayItems = getDisplayItems();
      const totalDisplay = displayItems.length;
      const totalPages = itemsPerPage === 0 ? 1 : Math.ceil(totalDisplay / itemsPerPage);
      if (totalDisplay === 0) {
        currentPage = 0;
      } else if (currentPage >= totalPages) {
        currentPage = totalPages - 1;
      }
      const pageItems = getPaginatedData(displayItems);

      const curPageDisplay = totalDisplay === 0 ? 0 : currentPage + 1;
      pageInfo.textContent = totalDisplay === 0 ? '0 / 0' : `${curPageDisplay} / ${totalPages}`;
      pageInput.value = curPageDisplay;
      pageInput.max = totalPages;
      prevPageBtn.disabled = currentPage === 0 || totalDisplay === 0;
      nextPageBtn.disabled = currentPage >= totalPages - 1 || totalDisplay === 0;

      const totalAll = allData.length;
      const filteredCount = getFilteredData().length;
      const searchTerm = searchInput.value.trim();
      let statsText = `Всего: ${totalAll} | Отфильтровано: ${filteredCount} | Показано: ${totalDisplay}`;
      if (filterByImported.checked && importedNumbers.length > 0) {
        statsText += ` (только загруженные)`;
      }
      if (searchTerm !== '') {
        statsText += ` | Поиск: "${searchTerm}"`;
      }
      statsSpan.textContent = statsText;

      if (totalDisplay === 0) {
        container.innerHTML = '<div class="loader">Нет записей, соответствующих фильтрам.</div>';
        countStatus.textContent = '0';
        return;
      }

      let html = '';
      const user = getCurrentUserInfo();
      for (const item of pageItems) {
        const key = item.key;
        const original = item.original || '';
        const translation = item.translation || '';
        const wtsComment = item.wtsComment || '';
        const userComments = item.userComments || [];
        const translationAuthorName = item.translationAuthorName || '';
        const confirmed = item.confirmed || false;
        const confirmedByName = item.confirmedByName || '';
        const inactive = item.inactive || false;
        const safeKey = key.replace(/"/g, '&quot;');
        let groupInfo = '';
        if (groupMode.checked && item._groupMembers && item._groupMembers.length > 1) {
          const members = item._groupMembers;
          const keys = members.map(m => m.key).join(', ');
          groupInfo = `Группа (${members.length} шт: #${keys})`;
        }

        let translationAuthorDisplay = translationAuthorName ? `✍️ ${escapeHtml(translationAuthorName)}` : '';
        let confirmedDisplay = '';
        let confirmButton = '';
        if (user.role === 'editor') {
          const hasTranslation = translation.trim() !== '';
          const isConfirmed = confirmed;
          let btnLabel = isConfirmed ? 'Отменить подтверждение' : (hasTranslation ? 'Подтвердить' : 'Нет перевода');
          let btnClass = 'confirm-btn';
          if (isConfirmed) btnClass += ' confirmed';
          if (!hasTranslation) btnClass += ' disabled';
          const disabledAttr = hasTranslation ? '' : ' disabled';
          const title = hasTranslation ? (isConfirmed ? 'Снять подтверждение' : 'Подтвердить перевод') : 'Нет перевода для подтверждения';
          confirmButton = `<button class="${btnClass}" data-key="${safeKey}"${disabledAttr} title="${title}">${btnLabel}</button>`;
        }
        if (confirmed) {
          confirmedDisplay = `<span class="confirmed-badge">✅ Подтверждено${confirmedByName ? ' (' + escapeHtml(confirmedByName) + ')' : ''}</span>`;
        }

        let inactiveButton = '';
        if (user.role === 'editor') {
          const label = inactive ? 'Активировать' : 'Сделать неактивной';
          const btnClass = inactive ? 'inactive-btn active' : 'inactive-btn';
          inactiveButton = `<button class="${btnClass}" data-key="${safeKey}">${label}</button>`;
        }

        const similarButton = `<button class="similar-btn" data-key="${safeKey}"> Похожие</button>`;

        let commentHtml = '';
        if (wtsComment) {
          commentHtml += `<div class="wts-comment"> Из файла: ${escapeHtml(wtsComment)}</div>`;
        }
        const showComments = userComments.slice(-5);
        if (showComments.length > 0) {
          commentHtml += `<div style="margin-top:4px;">`;
          for (const c of showComments) {
            const author = c.authorName || 'Аноним';
            const text = c.text || '';
            commentHtml += `<div class="user-comment"><span class="comment-text">${escapeHtml(text)}</span><span class="comment-author">${escapeHtml(author)}</span></div>`;
          }
          commentHtml += `</div>`;
        }
        if (userComments.length > 5) {
          commentHtml += `<button class="show-all-btn" data-key="${safeKey}">Показать все комментарии (${userComments.length})</button>`;
        }

        const commentInputHtml = `
          <input class="comment-input" type="text" placeholder="Оставить комментарий..." data-key="${safeKey}">
          <button class="comment-save-btn" data-key="${safeKey}">Отправить</button>
        `;

        let entryClasses = 'entry';
        if (inactive) entryClasses += ' inactive';
        if (groupMode.checked && item._groupMembers && item._groupMembers.length > 1) entryClasses += ' group-header';

        const groupDataEncoded = item._groupMembers ? encodeURIComponent(JSON.stringify(item._groupMembers)) : '';

        const leftColHtml = `
          <div class="left-col">
            <div class="meta">#${key}</div>
            <div class="original">${escapeHtml(original)}</div>
            ${groupInfo ? `<div class="group-info">${groupInfo}</div>` : ''}
          </div>
        `;

        const rightColHtml = `
          <div class="right-col">
            <div class="translation-row">
              <textarea class="translation-input" rows="1" data-key="${safeKey}" placeholder="Введите перевод... (Enter для переноса)">${escapeHtml(translation)}</textarea>
              <button class="save-translation-btn" data-key="${safeKey}">Сохранить перевод</button>
            </div>
            <div class="author-info">
              ${translationAuthorDisplay ? `<span>${translationAuthorDisplay}</span>` : ''}
              ${confirmedDisplay}
              ${confirmButton}
              ${inactiveButton}
              ${similarButton}
            </div>
          </div>
        `;

        html += `
          <div class="${entryClasses}" data-key="${safeKey}" data-group="${groupDataEncoded}">
            ${leftColHtml}
            ${rightColHtml}
            <div class="comment-section">
              ${commentHtml}
              ${commentInputHtml}
            </div>
          </div>
        `;
      }
      container.innerHTML = html;
      countStatus.textContent = totalDisplay;

      container.querySelectorAll('.translation-input').forEach(textarea => {
        autoResize(textarea);
        textarea.removeEventListener('input', handleTextareaInput);
        textarea.addEventListener('input', handleTextareaInput);
        textarea.removeEventListener('keydown', handleTextareaKeydown);
        textarea.addEventListener('keydown', handleTextareaKeydown);
      });

      container.querySelectorAll('.save-translation-btn').forEach(btn => {
        btn.removeEventListener('click', handleSaveTranslation);
        btn.addEventListener('click', handleSaveTranslation);
      });

      container.querySelectorAll('.comment-save-btn').forEach(btn => {
        btn.removeEventListener('click', handleCommentSave);
        btn.addEventListener('click', handleCommentSave);
      });

      container.querySelectorAll('.confirm-btn').forEach(btn => {
        btn.removeEventListener('click', handleConfirmToggle);
        btn.addEventListener('click', handleConfirmToggle);
      });

      container.querySelectorAll('.inactive-btn').forEach(btn => {
        btn.removeEventListener('click', handleInactiveToggle);
        btn.addEventListener('click', handleInactiveToggle);
      });

      container.querySelectorAll('.similar-btn').forEach(btn => {
        btn.removeEventListener('click', handleSimilar);
        btn.addEventListener('click', handleSimilar);
      });
    } catch (err) {
      console.error('Ошибка при рендеринге:', err);
      container.innerHTML = `<div class="loader" style="color:#c62828;">Ошибка отображения: ${err.message}</div>`;
    }
  }

  function handleTextareaInput(e) { autoResize(e.currentTarget); }

  function handleSaveTranslation(e) {
    const btn = e.currentTarget;
    const key = btn.dataset.key;
    const entry = btn.closest('.entry');
    const textarea = entry.querySelector('.translation-input');
    saveTranslation(key, textarea.value);
  }

  function handleTextareaKeydown(e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      const textarea = e.currentTarget;
      saveTranslation(textarea.dataset.key, textarea.value);
    }
  }

  function handleInactiveToggle(e) {
    toggleInactive(e.currentTarget.dataset.key);
  }

  function handleSimilar(e) {
    showSimilarTranslations(e.currentTarget.dataset.key);
  }

  function handleCommentSave(e) {
    const btn = e.currentTarget;
    const key = btn.dataset.key;
    const entry = btn.closest('.entry');
    const input = entry.querySelector('.comment-input');
    const commentText = input.value.trim();
    if (commentText === '') {
      alert('Комментарий не может быть пустым.');
      return;
    }
    const user = getCurrentUserInfo();
    const newComment = {
      author: user.uid,
      authorName: user.displayName,
      text: commentText,
      timestamp: Date.now()
    };
    const item = allData.find(d => d.key === key);
    if (!item) return;
    let comments = item.userComments || [];
    comments.push(newComment);
    if (comments.length > 50) comments = comments.slice(-50);
    stringsRef.child(key).update({ userComments: comments })
      .then(() => {
        const localItem = allData.find(d => d.key === key);
        if (localItem) localItem.userComments = comments;
        input.value = '';
        render();
      })
      .catch(err => alert('Ошибка сохранения комментария: ' + err.message));
  }

  function showAllCommentsForKey(key) {
    const item = allData.find(d => d.key === key);
    if (!item) return;
    const comments = item.userComments || [];
    if (comments.length === 0) return;
    modalKeySpan.textContent = key;
    modalTitle.textContent = `Комментарии к фразе #${key}`;
    let listHtml = '';
    for (const c of comments) {
      const author = c.authorName || 'Аноним';
      const text = c.text || '';
      const time = c.timestamp ? formatTimestamp(c.timestamp) : '';
      listHtml += `
        <div class="modal-comment">
          <span class="modal-text">${escapeHtml(text)}</span>
          <span class="modal-author">${escapeHtml(author)} ${time ? '— ' + time : ''}</span>
        </div>
      `;
    }
    modalCommentsList.innerHTML = listHtml;
    commentsModal.classList.add('active');
  }

  container.addEventListener('click', function(e) {
    const btn = e.target.closest('.show-all-btn');
    if (btn && btn.dataset.key) showAllCommentsForKey(btn.dataset.key);
  });

  modalCloseBtn.addEventListener('click', () => { commentsModal.classList.remove('active'); });
  commentsModal.addEventListener('click', (e) => {
    if (e.target === commentsModal) commentsModal.classList.remove('active');
  });
  similarModalClose.addEventListener('click', () => { similarModal.classList.remove('active'); });
  similarModal.addEventListener('click', (e) => {
    if (e.target === similarModal) similarModal.classList.remove('active');
  });

  function handleConfirmToggle(e) {
    const btn = e.currentTarget;
    const key = btn.dataset.key;
    const item = allData.find(d => d.key === key);
    if (!item) return;
    if (item.translation.trim() === '') {
      alert('Невозможно подтвердить: перевод отсутствует.');
      return;
    }
    const user = getCurrentUserInfo();
    if (user.role !== 'editor') {
      alert('Только редакторы могут подтверждать переводы.');
      return;
    }
    const newConfirmed = !item.confirmed;
    const updateData = {
      confirmed: newConfirmed,
      confirmedBy: newConfirmed ? user.uid : null,
      confirmedByName: newConfirmed ? user.displayName : null
    };
    stringsRef.child(key).update(updateData)
      .then(() => {
        if (item) {
          item.confirmed = newConfirmed;
          item.confirmedBy = newConfirmed ? user.uid : null;
          item.confirmedByName = newConfirmed ? user.displayName : null;
        }
        render();
      })
      .catch(err => alert('Ошибка обновления подтверждения: ' + err.message));
  }

  function parseWTS(text) {
    const regex = /STRING\s+(\d+)\s*(?:\/\/([^\n]*))?\s*\{([\s\S]*?)\}/g;
    const entries = [];
    let match;
    while ((match = regex.exec(text)) !== null) {
      const number = match[1];
      const comment = (match[2] || '').trim();
      const content = match[3];
      if (content.trim() !== '') entries.push({ number, comment, content });
    }
    return entries;
  }

  function importWTS(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const text = e.target.result;
        const parsed = parseWTS(text);
        if (parsed.length === 0) {
          alert('Не удалось найти ни одной непустой строки STRING в файле.');
          return;
        }
        if (!window.confirm(`Найдено ${parsed.length} непустых строк. Импортировать?`)) return;

        const norm = (t) => normalizeOriginalForCompare(t);
        const inactiveByContent = new Map();
        for (const item of allData) {
          if (item.inactive) inactiveByContent.set(norm(item.original), true);
        }

        const parsedByTarget = new Map();
        for (const p of parsed) parsedByTarget.set(String(p.number), p);
        const parsedByContent = new Map();
        for (const p of parsedByTarget.values()) parsedByContent.set(norm(p.content), p);

        const existingByContent = new Map();
        for (const item of allData) {
          const c = norm(item.original);
          if (!existingByContent.has(c)) existingByContent.set(c, item);
        }

        const replacedContents = new Set(parsedByContent.keys());
        const finalMap = new Map();
        for (const item of allData) {
          const c = norm(item.original);
          if (replacedContents.has(c)) continue;
          finalMap.set(item.key, { ...item });
        }

        const reservedIds = new Set();
        for (const p of parsedByContent.values()) reservedIds.add(String(p.number));

        let maxId = 0;
        for (const k of finalMap.keys()) maxId = Math.max(maxId, parseInt(k) || 0);
        for (const k of reservedIds) maxId = Math.max(maxId, parseInt(k) || 0);

        const itemsToRelocate = [];
        for (const [key, item] of finalMap) {
          if (reservedIds.has(String(key))) {
            itemsToRelocate.push(item);
            finalMap.delete(key);
          }
        }

        let nextId = maxId + 1;
        for (const item of itemsToRelocate) {
          while (reservedIds.has(String(nextId)) || finalMap.has(String(nextId))) nextId++;
          finalMap.set(String(nextId), { ...item, key: String(nextId) });
          nextId++;
        }

        for (const p of parsedByContent.values()) {
          const c = norm(p.content);
          const existing = existingByContent.get(c);
          const targetKey = String(p.number);

          if (finalMap.has(targetKey)) {
            let nid = nextId;
            while (reservedIds.has(String(nid)) || finalMap.has(String(nid))) nid++;
            const displaced = finalMap.get(targetKey);
            finalMap.delete(targetKey);
            finalMap.set(String(nid), { ...displaced, key: String(nid) });
            maxId = Math.max(maxId, nid);
            nextId = nid + 1;
          }

          const existingInactive = existing
            ? (existing.inactive || false)
            : (inactiveByContent.get(c) || false);
          const inactiveFinal = inactiveByContent.get(c) || existingInactive;

          finalMap.set(targetKey, {
            key: targetKey,
            original: p.content,
            translation: existing ? (existing.translation || '') : '',
            translationAuthor: existing ? (existing.translationAuthor || '') : '',
            translationAuthorName: existing ? (existing.translationAuthorName || '') : '',
            wtsComment: p.comment || '',
            userComments: existing ? (existing.userComments || []) : [],
            confirmed: existing ? (existing.confirmed || false) : false,
            confirmedBy: existing ? (existing.confirmedBy || '') : '',
            confirmedByName: existing ? (existing.confirmedByName || '') : '',
            inactive: inactiveFinal
          });
        }

        const updates = {};
        for (const item of allData) {
          if (!finalMap.has(item.key)) updates[item.key] = null;
        }
        for (const [key, item] of finalMap) {
          updates[key] = {
            original: item.original || '',
            translation: item.translation || '',
            translationAuthor: item.translationAuthor || '',
            translationAuthorName: item.translationAuthorName || '',
            wtsComment: item.wtsComment || '',
            userComments: item.userComments || [],
            confirmed: item.confirmed || false,
            confirmedBy: item.confirmedBy || '',
            confirmedByName: item.confirmedByName || '',
            inactive: item.inactive || false
          };
        }

        const relocatedCount = itemsToRelocate.length;

        stringsRef.update(updates)
          .then(() => {
            const numbers = parsed.map(item => item.number);
            const structure = parsed.map(item => ({
              id: String(item.number),
              content: item.content,
              comment: item.comment || ''
            }));
            metadataRef.set({ importedNumbers: numbers, lastImportStructure: structure })
              .then(() => {
                importedNumbers = numbers;
                lastImportStructure = structure;
                filterByImported.checked = true;
                currentPage = 0;
                let msg = `Импортировано ${parsed.length} строк. Включён фильтр "Только загруженные".`;
                if (relocatedCount > 0) msg += `\nПеренесено старых фраз (конфликт по ID): ${relocatedCount}.`;
                alert(msg);
                render();
              })
              .catch(err => console.warn('Не удалось сохранить метаданные:', err));
          })
          .catch(err => {
            console.error('Ошибка импорта:', err);
            alert('Ошибка импорта: ' + err.message);
          });
      } catch (err) {
        alert('Ошибка при обработке файла: ' + err.message);
      }
    };
    reader.onerror = () => alert('Ошибка чтения файла');
    reader.readAsText(file, 'UTF-8');
  }

  importBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', function(e) {
    if (this.files && this.files[0]) importWTS(this.files[0]);
    this.value = '';
  });

  function importTranslationsFromWTS(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const text = e.target.result;
        const parsed = parseWTS(text);
        if (parsed.length === 0) {
          alert('Не удалось найти ни одной непустой строки STRING в файле.');
          return;
        }
        const user = getCurrentUserInfo();
        const shouldConfirm = confirmImportedTranslations.checked;
        const structureById = new Map();
        for (const s of lastImportStructure) structureById.set(String(s.id), s);
        const dbByContent = new Map();
        for (const item of allData) {
          const c = normalizeOriginalForCompare(item.original);
          if (!dbByContent.has(c)) dbByContent.set(c, item.key);
        }
        const updates = {};
        let added = 0;
        let skippedUntranslated = 0;
        const notFound = [];
        for (const item of parsed) {
          const id = String(item.number);
          const transContent = item.content.trim();
          if (!transContent) continue;
          let origContent = null;
          const struct = structureById.get(id);
          if (struct) origContent = struct.content;
          else {
            const byId = allData.find(d => d.key === id);
            if (byId) origContent = byId.original;
          }
          if (!origContent) { notFound.push(id); continue; }
          if (normalizeOriginalForCompare(transContent) === normalizeOriginalForCompare(origContent)) {
            skippedUntranslated++;
            continue;
          }
          const normOrig = normalizeOriginalForCompare(origContent);
          const dbKey = dbByContent.get(normOrig);
          if (!dbKey) { notFound.push(id); continue; }
          const updateData = {
            translation: transContent,
            translationAuthor: user.uid,
            translationAuthorName: user.displayName
          };
          if (shouldConfirm) {
            updateData.confirmed = true;
            updateData.confirmedBy = user.uid;
            updateData.confirmedByName = user.displayName;
          }
          updates[dbKey] = updateData;
          added++;
        }
        if (added === 0) {
          let msg = `Не найдено переводов для загрузки.\nПропущено непереведённых фраз: ${skippedUntranslated}.`;
          if (notFound.length > 0) msg += `\nНе найдено в базе по ID: ${notFound.length}.`;
          alert(msg);
          return;
        }
        const confirmMsg = shouldConfirm ? ' (будут помечены как ПОДТВЕРЖДЁННЫЕ)' : ' (без подтверждения)';
        if (!window.confirm(
          `Найдено переводов для загрузки: ${added}.\n` +
          `Пропущено непереведённых: ${skippedUntranslated}.\n` +
          `Не найдено в базе: ${notFound.length}.${confirmMsg}\n\nПродолжить?`
        )) return;
        const promiseArray = [];
        for (const [key, data] of Object.entries(updates)) {
          promiseArray.push(stringsRef.child(key).update(data));
        }
        Promise.all(promiseArray)
          .then(() => {
            for (const [key, data] of Object.entries(updates)) {
              const localItem = allData.find(d => d.key === key);
              if (localItem) {
                localItem.translation = data.translation;
                localItem.translationAuthor = data.translationAuthor;
                localItem.translationAuthorName = data.translationAuthorName;
                if (shouldConfirm) {
                  localItem.confirmed = data.confirmed;
                  localItem.confirmedBy = data.confirmedBy;
                  localItem.confirmedByName = data.confirmedByName;
                }
              }
            }
            render();
            alert(
              `Обновлено переводов: ${added}.\n` +
              `Пропущено непереведённых: ${skippedUntranslated}.` +
              (notFound.length > 0 ? `\nНе найдено: ${notFound.length}.` : '')
            );
          })
          .catch(err => alert('Ошибка при обновлении переводов: ' + err.message));
      } catch (err) {
        alert('Ошибка при обработке WTS-файла: ' + err.message);
      }
    };
    reader.onerror = () => alert('Ошибка чтения файла');
    reader.readAsText(file, 'UTF-8');
  }

  importTranslationsWtsBtn.addEventListener('click', () => translationsWtsInput.click());
  translationsWtsInput.addEventListener('change', function(e) {
    if (this.files && this.files[0]) importTranslationsFromWTS(this.files[0]);
    this.value = '';
  });

  function generateWTSFromStructure(data, structure) {
    const index = buildContentIndex(data);
    let output = '';
    let exportedCount = 0;
    for (const s of structure) {
      const c = normalizeForMatch(s.content);
      const dbKey = index.get(c);
      if (!dbKey) continue;
      const entry = data[dbKey];
      const translation = entry.translation || '';
      const textToWrite = translation.trim() !== '' ? translation : s.content;
      const comment = s.comment || entry.wtsComment || '';
      output += `STRING ${s.id}`;
      if (comment) output += ` // ${comment}`;
      output += `\n{\n${textToWrite}\n}\n\n`;
      exportedCount++;
    }
    return { text: output, count: exportedCount };
  }

  function exportWTS() {
    stringsRef.once('value', (snapshot) => {
      const data = snapshot.val();
      if (!data || Object.keys(data).length === 0) {
        alert('Нет данных для экспорта.');
        return;
      }
      if (!lastImportStructure || lastImportStructure.length === 0) {
        alert('Нет данных о последнем загруженном файле.\nСначала загрузите .wts с оригинальными фразами.');
        return;
      }
      const result = generateWTSFromStructure(data, lastImportStructure);
      if (result.count === 0) {
        alert('Ни одна фраза из последнего загруженного файла не найдена в базе. Экспорт отменён.');
        return;
      }
      const blob = new Blob([result.text], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'translated_strings.wts';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      alert(`Экспортировано ${result.count} фраз по структуре последнего загруженного файла.`);
    });
  }

  exportBtn.addEventListener('click', exportWTS);

  function downloadDatabase() {
    const user = getCurrentUserInfo();
    if (!user.canManageDb) {
      alert('У вас нет прав на скачивание базы данных.');
      return;
    }
    Promise.all([stringsRef.once('value'), metadataRef.once('value')])
      .then(([stringsSnap, metadataSnap]) => {
        const stringsData = stringsSnap.val() || {};
        const metadataData = metadataSnap.val() || {};
        const backup = {
          _meta: {
            exportedAt: new Date().toISOString(),
            exportedBy: { uid: user.uid, displayName: user.displayName },
            version: 1,
            stringsCount: Object.keys(stringsData).length
          },
          strings: stringsData,
          metadata: metadataData
        };
        const json = JSON.stringify(backup, null, 2);
        const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const now = new Date();
        const ts = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}-${String(now.getMinutes()).padStart(2,'0')}-${String(now.getSeconds()).padStart(2,'0')}`;
        const filename = `kotmysh_db_backup_${ts}.json`;
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        alert(`База данных выгружена.\nФраз: ${Object.keys(stringsData).length}\nФайл: ${filename}`);
      })
      .catch(err => {
        console.error('Ошибка скачивания БД:', err);
        alert('Ошибка скачивания базы данных: ' + err.message);
      });
  }

  dbDownloadBtn.addEventListener('click', downloadDatabase);

  function restoreDatabase(file) {
    const user = getCurrentUserInfo();
    if (!user.canManageDb) {
      alert('У вас нет прав на восстановление базы данных.');
      return;
    }
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const text = e.target.result;
        let backup;
        try { backup = JSON.parse(text); }
        catch (parseErr) { alert('Файл не является корректным JSON.'); return; }
        if (!backup || typeof backup !== 'object') {
          alert('Неверный формат файла бэкапа.');
          return;
        }
        const stringsData = backup.strings || {};
        const metadataData = backup.metadata || {};
        const stringsCount = Object.keys(stringsData).length;
        if (stringsCount === 0 && Object.keys(metadataData).length === 0) {
          alert('Файл не содержит данных для восстановления.');
          return;
        }
        const meta = backup._meta || {};
        const exportedInfo = meta.exportedAt
          ? `\nДата экспорта: ${new Date(meta.exportedAt).toLocaleString('ru-RU')}` : '';
        const authorInfo = meta.exportedBy && meta.exportedBy.displayName
          ? `\nЭкспортировал: ${meta.exportedBy.displayName}` : '';
        if (!confirm(
          `ВНИМАНИЕ! Восстановление базы данных ПОЛНОСТЬЮ ЗАМЕНИТ текущее содержимое.\n\n` +
          `В файле: ${stringsCount} фраз.${exportedInfo}${authorInfo}\n\n` +
          `Текущее содержимое будет безвозвратно удалено. Продолжить?`
        )) return;
        const code = prompt('Для подтверждения введите слово "ВОССТАНОВИТЬ" (без кавычек):');
        if (code !== 'ВОССТАНОВИТЬ') {
          alert('Операция отменена. Код не совпадает.');
          return;
        }
        if (!confirm('Последний шанс! Заменить всю базу данных содержимым файла?')) return;
        stringsRef.set(stringsData)
          .then(() => metadataRef.set(metadataData))
          .then(() => {
            importedNumbers = Array.isArray(metadataData.importedNumbers) ? metadataData.importedNumbers : [];
            lastImportStructure = Array.isArray(metadataData.lastImportStructure) ? metadataData.lastImportStructure : [];
            currentPage = 0;
            alert(`База данных успешно восстановлена.\nВосстановлено фраз: ${stringsCount}`);
            render();
          })
          .catch(err => {
            console.error('Ошибка восстановления БД:', err);
            alert('Ошибка при восстановлении базы данных: ' + err.message);
          });
      } catch (err) {
        alert('Ошибка при обработке файла: ' + err.message);
      }
    };
    reader.onerror = () => alert('Ошибка чтения файла');
    reader.readAsText(file, 'UTF-8');
  }

  dbRestoreBtn.addEventListener('click', () => dbRestoreInput.click());
  dbRestoreInput.addEventListener('change', function(e) {
    if (this.files && this.files[0]) restoreDatabase(this.files[0]);
    this.value = '';
  });

  function goToPage(page) {
    const displayItems = getDisplayItems();
    const totalPages = itemsPerPage === 0 ? 1 : Math.ceil(displayItems.length / itemsPerPage);
    if (totalPages === 0) currentPage = 0;
    else {
      if (page < 0) page = 0;
      if (page >= totalPages) page = totalPages - 1;
      currentPage = page;
    }
    render();
  }

  prevPageBtn.addEventListener('click', () => goToPage(currentPage - 1));
  nextPageBtn.addEventListener('click', () => goToPage(currentPage + 1));

  perPageSelect.addEventListener('change', function() {
    itemsPerPage = parseInt(this.value, 10);
    currentPage = 0;
    render();
  });

  function handleGoto() {
    let page = parseInt(pageInput.value, 10);
    if (isNaN(page) || page < 1) page = 1;
    const displayItems = getDisplayItems();
    const totalPages = itemsPerPage === 0 ? 1 : Math.ceil(displayItems.length / itemsPerPage);
    if (totalPages === 0) page = 1;
    if (page > totalPages) page = totalPages;
    goToPage(page - 1);
  }

  gotoPageBtn.addEventListener('click', handleGoto);
  pageInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') handleGoto(); });

  searchInput.addEventListener('input', () => { currentPage = 0; render(); });

  filterOnlyRussian.addEventListener('change', () => { currentPage = 0; render(); });
  filterNoTranslation.addEventListener('change', () => { currentPage = 0; render(); });
  filterHideEditorSuffix.addEventListener('change', () => { currentPage = 0; render(); });
  filterUnconfirmed.addEventListener('change', () => { currentPage = 0; render(); });
  filterByImported.addEventListener('change', () => { currentPage = 0; render(); });
  filterInactive.addEventListener('change', () => { currentPage = 0; render(); });
  groupMode.addEventListener('change', () => { currentPage = 0; render(); });

  refreshBtn.addEventListener('click', () => { stringsRef.once('value', () => render()); });

  metadataRef.on('value', (snapshot) => {
    const data = snapshot.val();
    if (data && data.importedNumbers) {
      importedNumbers = data.importedNumbers;
      lastImportStructure = Array.isArray(data.lastImportStructure) ? data.lastImportStructure : [];
      if (filterByImported.checked) render();
    }
  });

  metadataRef.once('value', (snapshot) => {
    const data = snapshot.val();
    if (data && data.importedNumbers) {
      importedNumbers = data.importedNumbers;
      lastImportStructure = Array.isArray(data.lastImportStructure) ? data.lastImportStructure : [];
      filterByImported.checked = true;
      render();
    }
  });

  // ========== СЛУШАЕМ ИЗМЕНЕНИЯ В БАЗЕ ==========
  stringsRef.on('value', (snapshot) => {
    const data = snapshot.val();
    if (!data) { allData = []; render(); return; }
    const entries = Object.entries(data).sort((a, b) => parseInt(a[0]) - parseInt(b[0]));
    
    allData = entries.map(([key, entry]) => {
      let wtsComment = entry.wtsComment || '';
      let userComments = entry.userComments || [];
      if (entry.comment && !wtsComment) wtsComment = entry.comment;

      return {
        key,
        original: entry.original || '',
        translation: entry.translation || '',
        translationAuthor: entry.translationAuthor || '',
        translationAuthorName: entry.translationAuthorName || '',
        wtsComment: wtsComment,
        userComments: Array.isArray(userComments) ? userComments : [],
        confirmed: entry.confirmed || false,
        confirmedBy: entry.confirmedBy || '',
        confirmedByName: entry.confirmedByName || '',
        inactive: entry.inactive || false
      };
    });
    render();
  });

  const connectedRef = firebase.database().ref('.info/connected');
  connectedRef.on('value', (snap) => {
    if (snap.val()) {
      connectionStatus.innerHTML = '✅ Подключено к Firebase';
      connectionStatus.style.color = '#2e7d32';
    } else {
      connectionStatus.innerHTML = '❌ Офлайн (изменения сохранятся позже)';
      connectionStatus.style.color = '#e53935';
    }
  });

  console.log('Приложение готово.');
</script>
